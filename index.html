<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GOlife · VLLV Orquestrador</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600&family=Orbitron:wght@400;500;700;900&display=swap');
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg0:#040b1e;--ice:#bfe9ff;--cy:#4de8ff;--cy2:#2dd4ff;--blue:#3b82f6;--blue2:#1d4ed8;--deep:#1e40af;--text:#dbeafe;--dim:rgba(219,234,254,.5);--pink:#ec4899;--green:#34d399;--amber:#fbbf24;--persona:#a78bfa;}
html,body{height:100%;overflow:hidden;}
body{background:var(--bg0);font-family:'Inter',sans-serif;color:var(--text);position:relative;}
#brain{position:fixed;inset:0;width:100%;height:100%;z-index:1;display:block;cursor:pointer;background:radial-gradient(ellipse at 30% 20%,rgba(124,58,237,.16) 0%,transparent 45%),radial-gradient(ellipse at 70% 80%,rgba(37,99,235,.2) 0%,transparent 50%),radial-gradient(ellipse at 50% 45%,#0c2250 0%,#071636 50%,#040b1e 100%);}
.vignette{position:fixed;inset:0;z-index:2;pointer-events:none;background:radial-gradient(ellipse at center,transparent 45%,rgba(4,11,30,.75) 100%);}
.sys-label{position:fixed;top:22px;left:50%;transform:translateX(-50%);z-index:10;font-family:'Orbitron',sans-serif;font-size:11px;letter-spacing:4px;color:var(--dim);text-transform:uppercase;display:flex;align-items:center;gap:10px;opacity:0;animation:fadein 1.2s .3s forwards;text-shadow:0 0 20px rgba(0,0,0,.8);}
.sys-label .live{width:6px;height:6px;border-radius:50%;background:var(--green);box-shadow:0 0 10px var(--green);animation:pulse 2s infinite;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
@keyframes fadein{to{opacity:1}}
.growth{position:fixed;top:54px;left:50%;transform:translateX(-50%);z-index:10;font-size:11px;color:var(--persona);letter-spacing:1px;opacity:0;animation:fadein 1s 1s forwards;text-shadow:0 0 12px rgba(0,0,0,.8);}
.growth b{color:#fff;font-weight:600;}
.caption{position:fixed;bottom:150px;left:50%;transform:translateX(-50%);z-index:10;max-width:640px;width:calc(100% - 48px);text-align:center;font-size:17px;line-height:1.6;font-weight:300;color:#eaf4ff;text-shadow:0 2px 20px rgba(0,0,0,.9);opacity:0;transition:opacity .4s;pointer-events:none;}
.caption.show{opacity:1;}
.status-txt{position:fixed;bottom:120px;left:50%;transform:translateX(-50%);z-index:10;font-size:13px;color:var(--dim);letter-spacing:2px;text-align:center;width:calc(100% - 48px);pointer-events:none;transition:all .3s;}
.dock{position:fixed;bottom:28px;left:50%;transform:translateX(-50%);z-index:20;display:flex;gap:10px;align-items:center;width:calc(100% - 48px);max-width:680px;}
.dock-field{flex:1;background:rgba(10,24,56,.6);backdrop-filter:blur(20px);border:1px solid rgba(77,232,255,.25);border-radius:30px;padding:16px 22px;font-size:14px;color:var(--text);outline:none;font-family:'Inter',sans-serif;transition:all .2s;}
.dock-field:focus{border-color:rgba(77,232,255,.55);box-shadow:0 0 30px rgba(77,232,255,.18);}
.dock-field::placeholder{color:rgba(219,234,254,.35);}
.dock-btn{width:54px;height:54px;border-radius:50%;flex-shrink:0;cursor:pointer;border:1px solid rgba(77,232,255,.25);background:rgba(10,24,56,.6);backdrop-filter:blur(20px);color:var(--cy);font-size:20px;display:flex;align-items:center;justify-content:center;transition:all .2s;}
.dock-btn:hover{background:rgba(77,232,255,.12);border-color:rgba(77,232,255,.5);}
.dock-btn.mic-on{background:rgba(236,72,153,.2);border-color:var(--pink);color:var(--pink);animation:micp 1s infinite;}
@keyframes micp{0%,100%{box-shadow:0 0 0 0 rgba(236,72,153,.3)}50%{box-shadow:0 0 0 10px rgba(236,72,153,0)}}
.dock-btn.send{background:linear-gradient(135deg,var(--blue2),var(--cy2));border:none;color:#fff;}
.top-ctrl{position:fixed;top:20px;right:20px;z-index:20;display:flex;gap:8px;}
.ctrl-btn{width:42px;height:42px;border-radius:12px;cursor:pointer;border:1px solid rgba(77,232,255,.25);background:rgba(10,24,56,.6);backdrop-filter:blur(20px);color:var(--dim);font-size:16px;display:flex;align-items:center;justify-content:center;transition:all .2s;}
.ctrl-btn:hover{color:var(--cy);border-color:rgba(77,232,255,.4);}
.ctrl-btn.on{color:var(--cy);border-color:rgba(77,232,255,.4);background:rgba(77,232,255,.1);}
.voice-chip{position:fixed;top:20px;left:20px;z-index:20;display:flex;align-items:center;gap:8px;cursor:pointer;border:1px solid rgba(77,232,255,.25);background:rgba(10,24,56,.6);backdrop-filter:blur(20px);padding:9px 14px;border-radius:30px;font-size:12px;color:var(--text);transition:all .2s;}
.voice-chip:hover{border-color:rgba(77,232,255,.4);}
.node-info{position:fixed;z-index:30;pointer-events:none;background:rgba(10,24,56,.92);backdrop-filter:blur(16px);border:1px solid rgba(77,232,255,.45);border-radius:14px;padding:12px 16px;max-width:250px;opacity:0;transition:opacity .2s;transform:translate(-50%,calc(-100% - 18px));box-shadow:0 10px 50px rgba(0,0,0,.7);}
.node-info.show{opacity:1;}
.ni-cat{font-size:9px;font-weight:700;letter-spacing:1px;text-transform:uppercase;margin-bottom:4px;color:var(--cy);}
.ni-title{font-size:13px;font-weight:600;color:#fff;margin-bottom:3px;}
.ni-desc{font-size:11px;color:var(--dim);line-height:1.5;}
.back-btn{position:fixed;top:20px;left:50%;transform:translateX(-50%);z-index:21;display:none;align-items:center;gap:8px;cursor:pointer;border:1px solid rgba(77,232,255,.3);background:rgba(10,24,56,.7);backdrop-filter:blur(20px);padding:9px 18px;border-radius:30px;font-size:12px;color:var(--cy);font-family:'Orbitron',sans-serif;letter-spacing:1px;}
.back-btn.show{display:flex;}
/* ─── CARDS (confirm / cascade / onboarding) ─── */
.card{position:fixed;bottom:200px;left:50%;transform:translateX(-50%) translateY(20px);z-index:40;background:rgba(10,24,56,.96);backdrop-filter:blur(20px);border:1px solid rgba(167,139,250,.4);border-radius:16px;padding:18px;max-width:460px;width:calc(100% - 48px);box-shadow:0 20px 60px rgba(0,0,0,.6);opacity:0;pointer-events:none;transition:all .3s;}
.card.show{opacity:1;pointer-events:all;transform:translateX(-50%) translateY(0);}
.card-head{display:flex;align-items:center;gap:8px;font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--persona);margin-bottom:10px;}
.card-text{font-size:14px;color:#eaf4ff;line-height:1.55;margin-bottom:14px;}
.card-text b{color:#fff;}
.opts{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:10px;}
.opt{background:rgba(167,139,250,.12);border:1px solid rgba(167,139,250,.35);color:#c4b5fd;padding:8px 13px;border-radius:20px;font-size:12.5px;font-weight:500;cursor:pointer;font-family:'Inter',sans-serif;transition:all .15s;}
.opt:hover{background:rgba(167,139,250,.25);color:#fff;}
.opt.new{background:rgba(52,211,153,.12);border-color:rgba(52,211,153,.4);color:var(--green);}
.opt.sel{background:var(--persona);color:#fff;border-color:var(--persona);}
.card-field{width:100%;background:rgba(255,255,255,.08);border:1.5px solid rgba(167,139,250,.4);border-radius:10px;padding:10px 13px;font-size:13.5px;color:#fff;outline:none;font-family:'Inter',sans-serif;margin-bottom:10px;}
.card-field:focus{border-color:var(--persona);}
.card-btns{display:flex;gap:8px;}
.card-btn{flex:1;padding:10px;border-radius:10px;font-size:13px;font-weight:600;cursor:pointer;border:none;font-family:'Inter',sans-serif;transition:all .15s;}
.btn-primary{background:linear-gradient(135deg,#6d28d9,#a78bfa);color:#fff;}
.btn-primary:hover{box-shadow:0 0 20px rgba(167,139,250,.4);}
.btn-ghost{background:rgba(255,255,255,.08);color:var(--dim);border:1px solid rgba(255,255,255,.12);}
.btn-ghost:hover{background:rgba(255,255,255,.14);}
/* node menu */
.node-menu{position:fixed;z-index:35;background:rgba(10,24,56,.96);backdrop-filter:blur(18px);border:1px solid rgba(77,232,255,.35);border-radius:14px;padding:8px;min-width:180px;opacity:0;pointer-events:none;transform:translate(-50%,8px) scale(.95);transition:all .18s;box-shadow:0 16px 50px rgba(0,0,0,.6);}
.node-menu.show{opacity:1;pointer-events:all;transform:translate(-50%,0) scale(1);}
.nm-title{font-size:12px;font-weight:600;color:#fff;padding:6px 10px 8px;border-bottom:1px solid rgba(255,255,255,.08);margin-bottom:4px;}
.nm-btn{display:block;width:100%;text-align:left;background:none;border:none;color:var(--text);padding:9px 10px;border-radius:8px;font-size:13px;cursor:pointer;font-family:'Inter',sans-serif;}
.nm-btn:hover{background:rgba(77,232,255,.12);}
.nm-del{color:#ff6b8a;}.nm-del:hover{background:rgba(236,72,153,.15);}
.nm-cancel{color:var(--dim);font-size:12px;}
.nm-field{width:100%;background:rgba(255,255,255,.08);border:1.5px solid rgba(77,232,255,.4);border-radius:8px;padding:8px 10px;font-size:13px;color:#fff;outline:none;font-family:'Inter',sans-serif;margin-bottom:6px;}
.shape-grid{display:flex;flex-direction:column;gap:4px;padding:4px;}
.shape-opt{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:rgba(255,255,255,.04);border:1px solid rgba(167,139,250,.2);border-radius:9px;padding:8px 10px;cursor:pointer;color:var(--text);transition:.15s;}
.shape-opt:hover{background:rgba(167,139,250,.14);border-color:rgba(167,139,250,.45);}
.shape-opt.sel{border-color:var(--cy);background:rgba(77,232,255,.12);}
.shape-ic{font-size:17px;width:22px;text-align:center;}
.shape-lb{font-size:13px;display:flex;flex-direction:column;line-height:1.25;}
.shape-lb em{font-size:10px;color:var(--dim);font-style:normal;}
.link-list,.link-manage{display:flex;flex-direction:column;gap:4px;padding:4px;max-height:240px;overflow:auto;}
.link-opt{display:flex;flex-direction:column;align-items:flex-start;gap:1px;width:100%;text-align:left;background:rgba(255,255,255,.04);border:1px solid rgba(77,232,255,.2);border-radius:9px;padding:8px 10px;cursor:pointer;color:var(--text);transition:.15s;}
.link-opt:hover{background:rgba(77,232,255,.14);border-color:rgba(77,232,255,.45);}
.link-opt b{font-size:13px;font-weight:600;}
.link-opt em{font-size:10px;color:var(--dim);font-style:normal;}
.link-empty{padding:12px;font-size:12px;color:var(--dim);text-align:center;}
.link-row{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.04);border:1px solid rgba(167,139,250,.2);border-radius:9px;padding:7px 10px;}
.link-nm{flex:1;font-size:13px;}.link-nm em{font-size:10px;color:var(--cy);font-style:normal;margin-left:6px;}
.link-star,.link-x{width:26px;height:26px;border-radius:7px;border:none;cursor:pointer;background:rgba(255,255,255,.06);color:var(--dim);font-size:13px;}
.link-star:hover{color:#fbbf24;background:rgba(251,191,36,.15);}
.link-x:hover{color:#ff6b8a;background:rgba(236,72,153,.15);}
.sw-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;padding:6px 4px 8px;max-height:170px;overflow-y:auto;}
.sw{width:24px;height:24px;border-radius:50%;border:2px solid rgba(255,255,255,.2);cursor:pointer;padding:0;transition:transform .12s;}
.sw:hover{transform:scale(1.18);border-color:#fff;}
.sw.sel{border-color:#fff;box-shadow:0 0 0 2px rgba(255,255,255,.4);transform:scale(1.1);}
.sw-custom{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 10px;font-size:12px;color:var(--text);cursor:pointer;border-top:1px solid rgba(255,255,255,.08);}
.sw-custom input[type=color]{width:30px;height:24px;border:none;background:none;cursor:pointer;padding:0;}
/* chat */
.chat-toggle{position:fixed;bottom:96px;right:24px;z-index:19;width:44px;height:44px;border-radius:50%;cursor:pointer;border:1px solid rgba(77,232,255,.3);background:rgba(10,24,56,.7);backdrop-filter:blur(20px);color:var(--cy);font-size:18px;display:flex;align-items:center;justify-content:center;}
/* botão Legenda: cérebro pequeno + label em cima (canto inferior ESQUERDO) */
.legend-fab{position:fixed;bottom:150px;left:22px;z-index:19;display:flex;flex-direction:column;align-items:center;gap:5px;border:none;background:transparent;cursor:pointer;padding:0;}
.legend-fab-label{font-family:'Orbitron',sans-serif;font-size:12px;letter-spacing:2px;text-transform:uppercase;color:#bfeaff;text-shadow:0 2px 10px #000;}
.legend-fab-brain{width:58px;height:58px;border-radius:50%;background-size:cover;background-position:center;border:1.5px solid rgba(77,232,255,.55);box-shadow:0 0 18px rgba(58,120,255,.5),inset 0 0 14px rgba(77,232,255,.25);transition:.18s;}
.legend-fab:hover .legend-fab-brain{transform:scale(1.08);box-shadow:0 0 26px rgba(77,232,255,.7),inset 0 0 14px rgba(77,232,255,.3);border-color:var(--cy);}
.legend-fab:active .legend-fab-brain{transform:scale(.96);}
body.phase-brain .legend-fab{opacity:0;pointer-events:none;}
@media(max-width:600px){.legend-fab{bottom:140px;left:14px;}.legend-fab-brain{width:50px;height:50px;}.legend-fab-label{font-size:11px;}}
.chat-wrap{position:fixed;right:24px;bottom:96px;z-index:25;width:var(--chat-w,360px);max-width:calc(100vw - 48px);height:var(--chat-h,440px);max-height:76vh;background:rgba(7,18,42,.94);backdrop-filter:blur(24px);border:1px solid rgba(77,232,255,.2);border-radius:18px;display:flex;flex-direction:column;overflow:hidden;opacity:0;pointer-events:none;transform:translateY(16px) scale(.97);transition:opacity .3s, transform .3s;box-shadow:0 20px 60px rgba(0,0,0,.6);}
.chat-wrap.open{opacity:1;pointer-events:all;transform:translateY(0) scale(1);}
/* tamanhos (zoom) */
.chat-wrap.sm{--chat-w:300px;--chat-h:360px;}
.chat-wrap.md{--chat-w:380px;--chat-h:480px;}
.chat-wrap.lg{--chat-w:460px;--chat-h:620px;}
.chat-wrap.xl{--chat-w:560px;--chat-h:76vh;}
/* modo LATERAL: cola na esquerda, altura inteira */
.chat-wrap.side{left:0;right:auto;top:0;bottom:0;width:var(--chat-sw,380px);height:100%;max-height:100%;border-radius:0 18px 18px 0;border-left:none;}
.chat-wrap.side.sm{--chat-sw:320px;}.chat-wrap.side.md{--chat-sw:400px;}.chat-wrap.side.lg{--chat-sw:480px;}.chat-wrap.side.xl{--chat-sw:36vw;}
.chat-head{display:flex;align-items:center;justify-content:space-between;gap:6px;}
.chat-title{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.chat-ctrls{display:flex;align-items:center;gap:2px;flex-shrink:0;}
.chat-ic{width:26px;height:26px;border-radius:7px;border:none;background:rgba(255,255,255,.06);color:var(--cy);font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;line-height:1;}
.chat-ic:hover{background:rgba(77,232,255,.18);}
.chat-head{flex-shrink:0;padding:12px 16px;border-bottom:1px solid rgba(77,232,255,.12);display:flex;align-items:center;justify-content:space-between;font-size:12px;font-weight:600;color:#fff;}
.chat-min{background:none;border:none;color:var(--dim);cursor:pointer;font-size:16px;}
.chat-scroll{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:8px;}
.chat-scroll::-webkit-scrollbar{width:4px;}.chat-scroll::-webkit-scrollbar-thumb{background:rgba(77,232,255,.25);border-radius:4px;}
.cm{max-width:85%;padding:9px 13px;border-radius:14px;font-size:13px;line-height:1.5;animation:cmin .2s ease;}
@keyframes cmin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.cm.user{align-self:flex-end;background:linear-gradient(135deg,#1d4ed8,#2dd4ff);color:#fff;border-bottom-right-radius:4px;}
.cm.ai{align-self:flex-start;background:rgba(255,255,255,.06);border:1px solid rgba(77,232,255,.15);color:var(--text);border-bottom-left-radius:4px;}
.cm-from{font-size:9px;font-weight:700;letter-spacing:.5px;opacity:.6;margin-bottom:2px;text-transform:uppercase;}
.chat-empty{color:var(--dim);font-size:12px;text-align:center;margin:auto;padding:20px;line-height:1.6;}
/* sources panel */
.panel{position:fixed;top:0;right:0;bottom:0;width:340px;max-width:90vw;z-index:50;background:rgba(7,18,42,.97);backdrop-filter:blur(24px);border-left:1px solid rgba(77,232,255,.2);transform:translateX(100%);transition:transform .35s;display:flex;flex-direction:column;}
.panel.open{transform:translateX(0);}
.panel-head{padding:20px;border-bottom:1px solid rgba(77,232,255,.12);display:flex;align-items:center;justify-content:space-between;}
.panel-title{font-family:'Orbitron',sans-serif;font-size:13px;font-weight:700;letter-spacing:2px;color:#fff;}
.panel-close{width:30px;height:30px;border-radius:8px;border:1px solid rgba(255,255,255,.1);background:none;color:var(--dim);cursor:pointer;}
.panel-body{flex:1;overflow-y:auto;padding:16px;}
.src-group-title{font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--dim);margin:14px 0 8px;}
.src-item{display:flex;align-items:center;gap:12px;padding:12px;border-radius:12px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.07);margin-bottom:8px;}
.src-icon{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;background:rgba(77,232,255,.08);}
.src-info{flex:1;min-width:0;}.src-name{font-size:13px;font-weight:500;color:#fff;}.src-state{font-size:10px;margin-top:2px;}
.st-on{color:var(--green);}.st-off{color:var(--dim);}
.src-toggle{width:42px;height:24px;border-radius:20px;background:rgba(255,255,255,.1);cursor:pointer;position:relative;transition:all .2s;flex-shrink:0;border:none;}
.src-toggle.on{background:var(--green);}
.src-toggle::after{content:'';position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:all .2s;}
.src-toggle.on::after{left:21px;}
.src-auto{font-size:9px;padding:2px 6px;border-radius:20px;background:rgba(77,232,255,.12);color:var(--cy);margin-left:6px;}
/* VÍDEO do eu-digital na Fase 1 — bordas dissolvidas + halo colorido */
#brain-video-wrap{position:fixed;left:50%;top:40%;transform:translate(-50%,-50%);z-index:2;display:none;pointer-events:none;
  width:min(44vw,300px);aspect-ratio:288/512;max-height:52vh;}
#brain-video-wrap::before{content:'';position:absolute;inset:-22%;border-radius:50%;z-index:-1;
  background:radial-gradient(ellipse at 50% 42%, rgba(120,80,220,.42), rgba(58,120,255,.28) 42%, rgba(10,20,50,0) 72%);
  filter:blur(14px);animation:halopulse 4s ease-in-out infinite;}
@keyframes halopulse{0%,100%{opacity:.75;transform:scale(1)}50%{opacity:1;transform:scale(1.05)}}
#brain-video{width:100%;height:100%;object-fit:cover;display:block;border-radius:18px;
  /* dissolve as 4 bordas no fundo (sem cortar o conteúdo) */
  -webkit-mask:radial-gradient(ellipse 72% 72% at 50% 46%, #000 52%, rgba(0,0,0,.55) 74%, transparent 92%);
  mask:radial-gradient(ellipse 72% 72% at 50% 46%, #000 52%, rgba(0,0,0,.55) 74%, transparent 92%);
  mix-blend-mode:screen;}       /* screen funde os pretos do vídeo com o fundo */
body.phase-brain #brain-video-wrap{display:block;}
@media(max-width:600px){#brain-video-wrap{width:min(66vw,280px);top:38%;}}
/* FASE 1 (cérebro vivo): só cérebro + campo de fala */
body.phase-brain .sys-label,body.phase-brain .growth,body.phase-brain .top-ctrl,body.phase-brain .voice-chip,body.phase-brain .back-btn{opacity:0;pointer-events:none;}
/* LEGENDA do VLLV (tela cheia ao clicar no orquestrador) */
.legend-overlay{position:fixed;inset:0;z-index:80;background:radial-gradient(ellipse at 50% 42%,rgba(20,52,110,.6),rgba(4,10,28,.98) 70%),#040a1c;backdrop-filter:blur(8px);opacity:0;pointer-events:none;transition:opacity .4s;display:flex;align-items:center;justify-content:center;overflow:auto;}
.legend-overlay.open{opacity:1;pointer-events:auto;}
.legend-inner{width:min(1040px,96vw);padding:0;position:relative;display:flex;align-items:center;justify-content:center;}
.legend-wrap{position:relative;display:inline-block;line-height:0;}
.legend-img{width:100%;height:auto;max-height:92vh;object-fit:contain;border-radius:18px;box-shadow:0 20px 80px rgba(0,0,0,.7);display:block;}
.legend-fx{position:absolute;inset:0;border-radius:18px;pointer-events:none;}
.legend-brainbtn{position:absolute;left:30%;top:24%;width:42%;height:50%;border:none;background:transparent;cursor:pointer;border-radius:50%;}
.legend-brainbtn:hover{box-shadow:0 0 60px rgba(77,232,255,.35) inset;}
.legend-hint{position:absolute;left:50%;bottom:3%;transform:translateX(-50%);font-size:12px;color:#aee6ff;letter-spacing:1px;text-shadow:0 2px 10px #000;pointer-events:none;animation:hintpulse 2s infinite;}
@keyframes hintpulse{0%,100%{opacity:.5}50%{opacity:1}}
.legend-close{position:absolute;top:14px;right:18px;width:40px;height:40px;border-radius:12px;border:1px solid rgba(77,232,255,.3);background:rgba(10,24,56,.6);color:var(--cy);font-size:18px;cursor:pointer;z-index:2;}
.legend-close:hover{background:rgba(77,232,255,.14);}
.legend-title{text-align:center;font-family:'Orbitron',sans-serif;font-size:clamp(20px,3.4vw,34px);font-weight:700;letter-spacing:3px;color:#dff3ff;text-transform:uppercase;text-shadow:0 0 30px rgba(77,232,255,.5);margin-bottom:6px;}
.legend-sub{text-align:center;font-size:13px;color:var(--dim);margin-bottom:26px;letter-spacing:1px;}
.legend-brain{position:absolute;top:46%;left:50%;transform:translate(-50%,-50%);width:min(440px,54vw);height:min(440px,54vw);opacity:.5;pointer-events:none;filter:drop-shadow(0 0 40px rgba(77,232,255,.4));z-index:0;}
.legend-grid{position:relative;z-index:1;display:grid;grid-template-columns:1fr 1fr;gap:16px 90px;}
.legend-card{display:flex;align-items:center;gap:16px;background:linear-gradient(135deg,rgba(14,30,64,.82),rgba(8,18,44,.72));border:1px solid rgba(77,232,255,.28);border-radius:16px;padding:16px 18px;box-shadow:0 8px 32px rgba(0,0,0,.5),inset 0 0 20px rgba(77,232,255,.06);backdrop-filter:blur(6px);}
.legend-ic{width:54px;height:54px;flex-shrink:0;display:flex;align-items:center;justify-content:center;}
.legend-ic svg{width:100%;height:100%;}
.legend-txt{line-height:1.35;}
.legend-txt b{display:block;font-size:16px;color:#fff;font-weight:700;}
.legend-txt span{font-size:13px;color:#9fb6d8;}
@media(max-width:720px){.legend-grid{grid-template-columns:1fr;gap:12px;}.legend-brain{opacity:.22;width:70vw;height:70vw;}.legend-inner{padding-top:56px;}}
/* painel base de conhecimento da pessoa */
.kb-panel{width:380px;}
.kb-sub{font-size:11px;color:var(--dim);margin-top:3px;}
.kb-actions{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap;}
.kb-act{flex:1;min-width:92px;font-size:12px;padding:9px 8px;border-radius:10px;border:1px solid rgba(167,139,250,.28);background:rgba(167,139,250,.08);color:var(--text);cursor:pointer;transition:.15s;white-space:nowrap;}
.kb-act:hover{background:rgba(167,139,250,.18);border-color:rgba(167,139,250,.5);}
.kb-act-del{border-color:rgba(236,72,153,.3);background:rgba(236,72,153,.08);color:#ff8fab;}
.kb-act-del:hover{background:rgba(236,72,153,.18);}
.kb-topics{display:flex;flex-direction:column;gap:8px;}
.kb-topic{background:rgba(255,255,255,.04);border:1px solid rgba(167,139,250,.2);border-left:3px solid var(--persona);border-radius:10px;padding:10px 12px;font-size:13px;color:var(--text);line-height:1.5;display:flex;align-items:flex-start;gap:8px;}
.kb-topic .kb-bullet{color:var(--persona);flex-shrink:0;}
.kb-topic .kb-rm{margin-left:auto;background:none;border:none;color:rgba(255,255,255,.25);cursor:pointer;font-size:14px;flex-shrink:0;}
.kb-topic .kb-rm:hover{color:#ff6b8a;}
.kb-empty{color:var(--dim);font-size:12px;text-align:center;padding:24px 12px;line-height:1.6;}
.kb-add{flex-shrink:0;padding:14px;border-top:1px solid rgba(77,232,255,.12);display:flex;gap:8px;}
.kb-input{flex:1;background:rgba(255,255,255,.06);border:1.5px solid rgba(167,139,250,.3);border-radius:12px;padding:10px 14px;font-size:13px;color:#fff;outline:none;font-family:'Inter',sans-serif;}
.kb-input:focus{border-color:var(--persona);}
.kb-addbtn{width:42px;height:42px;border-radius:12px;border:none;background:linear-gradient(135deg,#6d28d9,#a78bfa);color:#fff;font-size:20px;cursor:pointer;flex-shrink:0;}
/* ===== CELULAR ===== */
@media(max-width:600px){
  .status-txt{bottom:138px;}.caption{bottom:168px;font-size:15px;}
  .chat-wrap{width:calc(100vw - 24px);right:12px;left:12px;height:min(52vh,420px);}
  .chat-toggle{right:16px;}
  .dock{bottom:16px;width:calc(100% - 24px);gap:8px;}
  .dock-field{padding:15px 18px;font-size:16px;} /* 16px evita zoom no iOS */
  .dock-btn{width:50px;height:50px;font-size:19px;}
  .top-ctrl{top:12px;right:12px;gap:6px;}
  .ctrl-btn{width:40px;height:40px;}      /* alvo de toque confortável */
  .voice-chip{top:12px;left:12px;padding:8px 12px;font-size:11px;}
  .sys-label{top:64px;font-size:9px;letter-spacing:2px;}      /* abaixo dos botões, sem colidir */
  .growth{top:84px;}
  /* painéis laterais viram folha de baixo (bottom sheet), largura total */
  .panel,.kb-panel{top:auto;left:0;right:0;bottom:0;width:100%;max-width:100%;height:auto;max-height:82vh;border-left:none;border-top:1px solid rgba(77,232,255,.25);border-radius:20px 20px 0 0;transform:translateY(100%);}
  .panel.open,.kb-panel.open{transform:translateY(0);}
  .node-menu{min-width:200px;}
  .nm-btn,.shape-opt,.kb-act{padding:12px 12px;font-size:14px;} /* toque */
  .card{bottom:150px;}
}
/* ===== TV / MONITOR GRANDE ===== */
@media(min-width:1500px){
  .caption{font-size:20px;max-width:820px;}
  .dock{max-width:860px;}
  .dock-field{padding:18px 26px;font-size:16px;}
  .dock-btn{width:60px;height:60px;font-size:22px;}
  .ctrl-btn{width:48px;height:48px;font-size:18px;}
  .voice-chip{font-size:14px;padding:11px 18px;}
  .panel{width:420px;}.kb-panel{width:440px;}
}
</style>
</head>
<body>
<canvas id="brain"></canvas>
<!-- vídeo do "eu digital" na Fase 1 (bordas dissolvidas para fundir no fundo) -->
<div id="brain-video-wrap"><video id="brain-video" muted playsinline preload="auto"></video></div>
<div class="vignette"></div>
<div class="sys-label"><span class="live"></span> GOlife · VLLV Orquestrador · Online</div>
<div class="growth" id="growth"><b id="persona-count">0</b> personas · <b id="node-count">0</b> conhecimentos</div>
<div class="voice-chip" onclick="cycleVoice()"><span id="vc-icon">👨</span><span id="vc-name">voz...</span></div>
<div class="top-ctrl">
  <button class="ctrl-btn on" id="tts-btn" onclick="toggleTTS()" title="Voz">🔊</button>
  <button class="ctrl-btn" id="focus-btn" onclick="toggleFocus()" title="Ver rede">🧠</button>
  <button class="ctrl-btn" onclick="openPanel()" title="Fontes">🔌</button>
  <button class="ctrl-btn" onclick="exportMemory()" title="Exportar memória (.json)">⬇️</button>
  <button class="ctrl-btn" onclick="document.getElementById('import-file').click()" title="Importar memória (.json)">⬆️</button>
  <button class="ctrl-btn" onclick="confirmReset()" title="Recomeçar">♻️</button>
  <span id="gd-wrap" style="display:none;align-items:center;gap:6px;">
    <button class="ctrl-btn" id="gd-btn" onclick="gdToggle()" title="Conectar Google Drive">☁️</button>
  </span>
  <input type="file" id="import-file" accept="application/json,.json" style="display:none" onchange="importMemory(event)">
</div>
<div id="gd-status" style="position:fixed;top:56px;right:16px;z-index:19;font-size:10px;color:var(--dim);letter-spacing:.5px;opacity:.85;"></div>
<div class="back-btn" id="back-btn" onclick="backToMap()">← voltar</div>
<div class="caption" id="caption"></div>
<div class="status-txt" id="status">VLLV está montando sua estrutura...</div>
<div class="node-info" id="node-info"><div class="ni-cat" id="ni-cat"></div><div class="ni-title" id="ni-title"></div><div class="ni-desc" id="ni-desc"></div></div>
<div class="node-menu" id="node-menu"></div>

<!-- LEGENDA (abre ao clicar no VLLV) -->
<div class="legend-overlay" id="legend"><div class="legend-inner" id="legend-inner"></div></div>

<!-- CARD genérico (confirm sensível / cascata / onboarding) -->
<div class="card" id="card">
  <div class="card-head" id="card-head"></div>
  <div class="card-text" id="card-text"></div>
  <div class="opts" id="card-opts"></div>
  <div id="card-field-wrap"></div>
  <div class="card-btns" id="card-btns"></div>
</div>

<!-- botão da LEGENDA (cérebro pequeno, canto inferior direito) -->
<button class="legend-fab" id="legend-fab" onclick="openLegend()" title="Legenda do sistema">
  <span class="legend-fab-label">Legenda</span>
  <span class="legend-fab-brain"></span>
</button>
<!-- chat -->
<button class="chat-toggle" onclick="toggleChat()" title="Conversa">💬</button>
<div class="chat-wrap" id="chat-wrap">
  <div class="chat-head">
    <span class="chat-title">Conversa com <span class="agent-name-ref">VLLV</span></span>
    <span class="chat-ctrls">
      <button class="chat-ic" onclick="chatZoom(-1)" title="Diminuir">−</button>
      <button class="chat-ic" onclick="chatZoom(1)" title="Aumentar">+</button>
      <button class="chat-ic" id="chat-dock-btn" onclick="chatToggleDock()" title="Lateral / Flutuante">⇱</button>
      <button class="chat-ic" onclick="toggleChat()" title="Fechar">⌄</button>
    </span>
  </div>
  <div class="chat-scroll" id="chat-scroll"></div>
</div>

<!-- dock -->
<div class="dock">
  <input class="dock-field" id="inp" placeholder="Fale ou pergunte... (ex: tenho 2 filhas · o que sei sobre a Maisa?)" onkeydown="if(event.key==='Enter')send()">
  <button class="dock-btn" id="mic-btn" onclick="toggleMic()" title="Microfone">🎙️</button>
  <button class="dock-btn send" onclick="send()" title="Enviar">➤</button>
</div>

<!-- sources panel -->
<div class="panel" id="panel">
  <div class="panel-head"><div class="panel-title">FONTES</div><button class="panel-close" onclick="closePanel()">✕</button></div>
  <div class="panel-body" id="panel-body"></div>
</div>

<!-- PAINEL DE BASE DE CONHECIMENTO DE UMA PESSOA/NÓ -->
<div class="panel kb-panel" id="kb-panel">
  <div class="panel-head">
    <div><div class="panel-title" id="kb-title">PESSOA</div><div class="kb-sub" id="kb-sub"></div></div>
    <button class="panel-close" onclick="closeKb()">✕</button>
  </div>
  <div class="panel-body">
    <div class="kb-actions" id="kb-actions">
      <button class="kb-act" onclick="kbDetach()">✂️ Soltar vínculo</button>
      <button class="kb-act" onclick="kbColorFromPanel()">🎨 Cor</button>
      <button class="kb-act kb-act-del" onclick="kbDeleteFromPanel()">🗑 Apagar</button>
    </div>
    <div class="kb-topics" id="kb-topics"></div>
  </div>
  <div class="kb-add">
    <input class="kb-input" id="kb-input" placeholder="Adicionar sobre esta pessoa..." onkeydown="if(event.key==='Enter')kbAdd()">
    <button class="kb-addbtn" onclick="kbAdd()">+</button>
  </div>
</div>

// Banco embarcado: IndexedDB (principal) + localStorage (cache rápido) + Google Drive (nuvem).
const STORE_KEY='golife_orq_v1';let _saveT=null;let _lastEdit=0;
// aplica um snapshot {agentName,userName,graph,...} ao estado em memória
function applySnapshot(d){
  if(!d||!d.graph||!d.graph.nodes)return false;
  agentName=d.agentName||'VLLV';userName=d.userName||null;onboarded=!!d.onboarded;activePersonaId=d.activePersonaId||null;
  graph.nodes=d.graph.nodes;graph.nextId=d.graph.nextId||graph.nodes.length+1;chatLog=d.chatLog||[];
  if(d.personaColors)personaColors=d.personaColors;
  if(d.sources)d.sources.forEach(sv=>{const s=sources.find(x=>x.id===sv.id);if(s&&!s.fixed)s.state=sv.state;});
  const c=graph.nodes.find(n=>n.kind==='orchestrator');if(c)c.label=agentName;
  return true;
}
// snapshot com carimbo de tempo (usado p/ IndexedDB e Drive, e p/ merge por mais recente)
function stampedSnapshot(){const s=memorySnapshot();s.updatedAt=Date.now();return s;}

function saveState(){clearTimeout(_saveT);_lastEdit=Date.now();_saveT=setTimeout(()=>{
  const snap=stampedSnapshot();const json=JSON.stringify(snap);
  try{localStorage.setItem(STORE_KEY,json);}catch(e){}   // cache rápido
  DB.save(snap).catch(()=>{});                            // banco embarcado (IndexedDB)
  GDrive.schedulePush();                                  // nuvem (Drive) se logado
},300);}

// carrega do banco local (IndexedDB → localStorage fallback). Retorna true se havia dado.
async function loadState(){
  try{const d=await DB.load();if(d&&applySnapshot(d)){return true;}}catch(e){}
  try{const raw=localStorage.getItem(STORE_KEY);if(raw){const d=JSON.parse(raw);if(applySnapshot(d)){DB.save(stampedSnapshot()).catch(()=>{});return true;}}}catch(e){}
  return false;
}
function resetState(){try{localStorage.removeItem(STORE_KEY);}catch(e){}DB.clear().catch(()=>{});DB.memClear&&DB.memClear().catch(()=>{});location.reload();}

// ── IndexedDB (banco embarcado) ──
// STORE 'memoria' = snapshot completo (grafo). STORE 'memories' = FATOS atômicos (base do aprendizado).
const DB=(()=>{
  const NAME='vllv_db',STORE='memoria',KEY='current',MEM='memories';let _db=null;
  function open(){return new Promise((res,rej)=>{if(_db)return res(_db);const r=indexedDB.open(NAME,2);
    r.onupgradeneeded=(ev)=>{const db=r.result;
      if(!db.objectStoreNames.contains(STORE))db.createObjectStore(STORE);
      if(!db.objectStoreNames.contains(MEM)){const os=db.createObjectStore(MEM,{keyPath:'id'});os.createIndex('nodeId','nodeId',{unique:false});os.createIndex('ts','ts',{unique:false});}
    };
    r.onsuccess=()=>{_db=r.result;res(_db);};r.onerror=()=>rej(r.error);});}
  function tx(store,mode){return open().then(db=>db.transaction(store,mode).objectStore(store));}
  return {
    // snapshot do grafo
    async save(snap){const os=await tx(STORE,'readwrite');return new Promise((res,rej)=>{const r=os.put(snap,KEY);r.onsuccess=()=>res(true);r.onerror=()=>rej(r.error);});},
    async load(){const os=await tx(STORE,'readonly');return new Promise((res,rej)=>{const g=os.get(KEY);g.onsuccess=()=>res(g.result||null);g.onerror=()=>rej(g.error);});},
    async clear(){const os=await tx(STORE,'readwrite');return new Promise((res)=>{const r=os.delete(KEY);r.onsuccess=()=>res(true);r.onerror=()=>res(false);});},
    // ── FATOS (memories) — a base do aprendizado semântico ──
    async memPut(fact){const os=await tx(MEM,'readwrite');return new Promise((res,rej)=>{const r=os.put(fact);r.onsuccess=()=>res(true);r.onerror=()=>rej(r.error);});},
    async memAll(){const os=await tx(MEM,'readonly');return new Promise((res,rej)=>{const g=os.getAll();g.onsuccess=()=>res(g.result||[]);g.onerror=()=>rej(g.error);});},
    async memByNode(nodeId){const os=await tx(MEM,'readonly');return new Promise((res,rej)=>{const idx=os.index('nodeId');const g=idx.getAll(nodeId);g.onsuccess=()=>res(g.result||[]);g.onerror=()=>rej(g.error);});},
    async memDelete(id){const os=await tx(MEM,'readwrite');return new Promise((res)=>{const r=os.delete(id);r.onsuccess=()=>res(true);r.onerror=()=>res(false);});},
    async memClear(){const os=await tx(MEM,'readwrite');return new Promise((res)=>{const r=os.clear();r.onsuccess=()=>res(true);r.onerror=()=>res(false);});},
    async memCount(){const os=await tx(MEM,'readonly');return new Promise((res)=>{const r=os.count();r.onsuccess=()=>res(r.result||0);r.onerror=()=>res(0);});}
  };
})();

// ── MEMÓRIA SEMÂNTICA (camada de aprendizado) ──
// Cada FATO atômico vira um registro indexável. O campo 'vec' fica reservado para
// embeddings (próximo passo): quando ligarmos, é só preencher — o resto não muda.
const Learn=(()=>{
  function pathOf(nodeId){ // "Família › Maisa" — trilha de onde o fato vive
    const parts=[];let n=nodeById(nodeId);let guard=0;
    while(n&&n.kind!=='orchestrator'&&guard++<12){parts.unshift(n.label);n=nodeById(n.parent);}
    return parts.join(' › ');
  }
  function mkId(){return 'm'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);}
  return {
    // registra um fato aprendido (texto + de onde veio)
    async remember(text,nodeId,source){
      text=(text||'').trim();if(!text)return;
      const fact={id:mkId(),text,nodeId:nodeId||null,path:nodeId?pathOf(nodeId):'',source:source||'conversa',ts:Date.now(),vec:null};
      try{await DB.memPut(fact);}catch(e){}
      return fact;
    },
    // busca por palavras (relevância simples). Depois troco por similaridade vetorial, sem mudar quem chama.
    async search(query,limit){
      limit=limit||8;const terms=(query||'').toLowerCase().split(/\W+/).filter(w=>w.length>2);
      if(!terms.length)return [];
      let all=[];try{all=await DB.memAll();}catch(e){return [];}
      const scored=all.map(f=>{const low=(f.text+' '+(f.path||'')).toLowerCase();let s=0;terms.forEach(t=>{if(low.includes(t))s++;});return{f,s};}).filter(x=>x.s>0);
      scored.sort((a,b)=>b.s-a.s||b.f.ts-a.f.ts);
      return scored.slice(0,limit).map(x=>x.f);
    },
    async count(){try{return await DB.memCount();}catch(e){return 0;}},
    async clear(){try{await DB.memClear();}catch(e){}},
    // varre a rede atual e popula a tabela de fatos com o que já existe (uma vez)
    async backfill(){
      let n=0;
      for(const node of graph.nodes){
        if(node.kind==='orchestrator')continue;
        // o próprio nó como fato (nome + papel/descrição)
        const base=node.role?`${node.label} (${node.role})`:node.label;
        await this.remember(base,node.id,'rede'); n++;
        // tópicos do nó
        if(Array.isArray(node.topics)) for(const t of node.topics){ await this.remember(t,node.id,'rede'); n++; }
      }
      return n;
    }
  };
})();

// ═══════════ HELPERS DE GRAFO ═══════════
function personas(){return graph.nodes.filter(n=>n.kind==='persona'&&!n.floating);}
function floatingNodes(){return graph.nodes.filter(n=>n.floating);}
function childrenOf(id){return graph.nodes.filter(n=>n.parent===id);}
function nodeById(id){return graph.nodes.find(n=>n.id===id);}
// TODOS os pais de um nó: o principal (parent) + os vínculos extras (links[])
function parentsOf(node){const ids=[];if(node.parent)ids.push(node.parent);if(Array.isArray(node.links))node.links.forEach(id=>{if(id&&id!==node.parent&&!ids.includes(id))ids.push(id);});return ids;}
// um nó está ligado a outro? (por parent principal OU por vínculo extra)
function isLinkedTo(node,targetId){return node.parent===targetId||(Array.isArray(node.links)&&node.links.includes(targetId));}
// adiciona um vínculo extra (mantendo o pai atual) — qualquer nó pode ter vários
function addLink(node,targetId){
  if(!node||!targetId||node.id===targetId)return false;
  if(isLinkedTo(node,targetId)){showCaption(`${node.label} já está ligado a ${nodeById(targetId)?.label||'esse nó'}.`);return false;}
  // impede ciclo: o alvo não pode ser descendente do nó
  let p=nodeById(targetId);const seen=new Set();while(p&&!seen.has(p.id)){seen.add(p.id);if(p.id===node.id){showCaption('Não dá para ligar dentro de um descendente.');return false;}p=nodeById(p.parent);}
  if(!Array.isArray(node.links))node.links=[];
  if(node.floating){node.floating=false;node.parent=targetId;} // se estava solto, o 1º vínculo vira o principal
  else node.links.push(targetId);
  node.pinned=false;delete node.px;delete node.py; // volta a posicionar automático (entre os pais)
  rebuildPositions();updateCount();saveState();
  const tgt=nodeById(targetId);
  showCaption(`"${node.label}" agora também deriva de "${tgt?.label}". (${parentsOf(node).length} vínculos)`);addChat('ai',`Liguei ${node.label} a ${tgt?.label}. Agora deriva de ${parentsOf(node).length} nós.`);
  return true;
}
// remove um vínculo específico. Se for o pai principal, promove outro link a principal.
function removeLink(node,targetId){
  if(!node)return;
  if(Array.isArray(node.links))node.links=node.links.filter(id=>id!==targetId);
  if(node.parent===targetId){ node.parent=(node.links&&node.links.length)?node.links.shift():null; if(!node.parent)node.floating=true; }
  node.pinned=false;delete node.px;delete node.py;
  rebuildPositions();updateCount();saveState();
  const n=parentsOf(node).length;
  showCaption(n?`"${node.label}" agora deriva de ${n} nó(s).`:`"${node.label}" ficou solto (sem vínculo).`);
}
function cap(s){s=(s||'').trim();return s.charAt(0).toUpperCase()+s.slice(1,60);}
function bases(){return graph.nodes.filter(n=>n.kind==='base');}
function basesOf(personaId){return graph.nodes.filter(n=>n.kind==='base'&&n.parent===personaId);}
function colorOf(node){
  if(node.kind==='orchestrator')return node.color||'#eaf7ff';
  if(node.color)return node.color;                       // cor escolhida pelo usuário (qualquer nó)
  if(node.kind==='persona')return personaColors[node.id]||PERSONA_COLOR;
  // base/conhecimento herdam a cor do ancestral mais próximo que tenha cor própria
  let p=nodeById(node.parent);
  while(p){ if(p.color)return p.color; if(p.kind==='persona')return personaColors[p.id]||PERSONA_COLOR; p=nodeById(p.parent); }
  return ICE.glow;
}
// forma a desenhar: VLLV é SEMPRE pentágono (fixo); senão usa a escolhida, ou esfera por padrão

  return node.shape||'sphere';
}

// a persona ativa (em foco). Se só existe uma, é ela. Se nenhuma, null.

}

// cria/acha uma PERSONA (nível 1, ligada ao VLLV) — ex: Vinicius, Sócio
function ensurePersona(label){

// cria/acha uma BASE (nível 2) DENTRO de uma persona — ex: Família, Trabalho
function ensureBase(label,personaId){

  if(!personaId)return null;
  const ex=graph.nodes.find(n=>n.kind==='base'&&n.parent===personaId&&n.label.toLowerCase()===label.toLowerCase());
  if(ex)return{base:ex,created:false};
  const b={id:'b'+graph.nextId++,label:cap(label),kind:'base',parent:personaId,born:performance.now()};
  graph.nodes.push(b);rebuildPositions();updateCount();

}
// adiciona conhecimento dentro de uma persona (ou dentro de um nó de conhecimento)
function addKnowledgeTo(parentId,sub,desc){
  const entity=detectEntity(sub);
  let node;
  if(entity){
    // descrição: o papel (esposa, chefe...) se houver, senão a desc passada
    const eDesc=entity.role?cap(entity.role):(desc||'');
    node=graph.nodes.find(n=>n.parent===parentId&&n.label.toLowerCase()===entity.name.toLowerCase());
    if(!node){node={id:'k'+graph.nextId++,label:cap(entity.name),kind:'knowledge',desc:eDesc,parent:parentId,isEntity:true,role:entity.role||null,born:performance.now()};graph.nodes.push(node);}
    else if(entity.role&&!node.role){node.role=entity.role;node.desc=cap(entity.role);} // enriquece se já existia sem papel
  }else{
    node={id:'k'+graph.nextId++,label:cap(sub),kind:'leaf',desc:desc||'',parent:parentId,born:performance.now()};
    graph.nodes.push(node);
  }
  rebuildPositions();updateCount();
  // APRENDE: registra o novo nó como fato (nome + papel) na memória semântica
  Learn.remember(node.role?`${node.label} (${node.role})`:node.label, node.id, 'conversa');
  return node;
}
function updateCount(){

// ── BASE DE CONHECIMENTO DE UMA PESSOA/NÓ (tópicos acumulados) ──
// Procura um nó de conhecimento existente cujo NOME é citado na frase (ex: "Maisa ...")
// normaliza um papel para comparação (tira acento, minúsculo, singular aproximado)
function normRole(s){return (s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/s$/,'');}
// sinônimos de papel: a palavra dita → papéis que casam
const ROLE_SYN={ esposa:['esposa','mulher','conjuge','companheira'], marido:['marido','esposo','conjuge','companheiro'],
  filho:['filho'], filha:['filha'], mae:['mae'], pai:['pai'], irmao:['irmao'], irma:['irma'],
  chefe:['chefe','gerente'], socio:['socio'], namorado:['namorado'], namorada:['namorada'] };
function findSubjectNode(text){
  const low=text.toLowerCase();
  const cands=graph.nodes.filter(n=>n.kind==='knowledge'||n.kind==='leaf');
  // 1) por NOME (mais específico primeiro)
  cands.sort((a,b)=>b.label.length-a.label.length);
  for(const n of cands){
    const name=n.label.toLowerCase();
    if(name.length<3)continue;
    const re=new RegExp('(^|\\W)'+name.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'(\\W|$)','i');
    if(re.test(low))return n;
  }
  // 2) por PAPEL / RELACIONAMENTO ("minha esposa", "meu pai", "minha filha")
  const rm=low.match(new RegExp('\\b(?:minha|meu|a|o|da|do)\\s+('+RELATION_TERMS+')\\b','i')) || low.match(new RegExp('\\b('+RELATION_TERMS+')\\b','i'));
  if(rm){
    const said=normRole(rm[1]);
    const want=new Set([said, ...(ROLE_SYN[said]||[])]);
    // nós com role que casa
    const byRole=cands.filter(n=>n.role&&want.has(normRole(n.role)));
    if(byRole.length===1)return byRole[0];
    if(byRole.length>1){ // ambíguo (ex: 2 filhas) — devolve marcador para pedir o nome
      return {_ambiguous:true, role:said, options:byRole};
    }
  }
  return null;
}
function addTopic(node,topicText){
  if(!node.topics)node.topics=[];
  const t=cap(topicText);
  if(!node.topics.includes(t)){node.topics.push(t);Learn.remember(t,node.id,'conversa');} // APRENDE: grava o fato na memória semântica
  // vira nó de conhecimento (deixa de ser folha) para poder abrir o painel
  if(node.kind==='leaf')node.kind='knowledge';
  rebuildPositions();updateCount();
  // se o painel dessa pessoa está aberto, atualiza
  if(openKbId===node.id)renderKbPanel(node);
  return t;
}
// tira o sujeito da frase (nome OU papel "minha esposa"), deixando só o conteúdo do tópico
function topicFromText(text,subjectLabel){
  let s=text.trim();
  const verbo='(é|e|tem|faz|mora|trabalha|gosta|adora|ama|curte|prefere|nasceu|estuda|quer|precisa|vai|:)?';
  // 1) remove o NOME do sujeito do início
  s=s.replace(new RegExp('^\\s*(a |o |minha |meu )?'+subjectLabel.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'\\s*'+verbo+'\\s*','i'),'');
  // 2) remove também o PAPEL do início ("minha esposa", "meu pai", "minha filha ...")
  s=s.replace(new RegExp('^\\s*(?:minha|meu|a|o)\\s+(?:'+RELATION_TERMS+')\\b\\s*'+verbo+'\\s*','i'),'');
  // 3) apara conectivos que sobraram no começo (de, da, do, que, a, o)
  s=s.replace(/^\s*(de|da|do|que|a|o)\s+/i,'');
  return s.trim()||text.trim();
}

// ═══════════ DETECÇÃO DE ENTIDADE ═══════════
// termos de relação/papel — quando seguidos de um nome próprio, o NÓ é o nome,
// e o termo vira a descrição (ex: "esposa Maisa" → nó "Maisa", papel "esposa")
const RELATION_TERMS='esposa|mulher|marido|c[oô]njuge|companheir[oa]|namorad[oa]|noiv[oa]|filh[oa]|filho|m[aã]e|pai|irm[aã]o|irm[aã]|av[oô]|av[óo]|tio|tia|primo|prima|sogr[oa]|cunhad[oa]|chefe|gerente|s[oó]cio|col[eé]ga|amigo|amiga|cliente|m[eé]dico|professor|professora';
function detectEntity(text,force){
  // 1) relação + Nome Próprio → entidade = o Nome, papel = a relação
  // 1a) se tem "chama/chamada/se chama/nome é X" → o nome é X (prioritário)
  let mc=text.match(new RegExp('\\b(?:minha |meu |a |o )?('+RELATION_TERMS+')\\b[^.]*?\\b(?:se chama|chamad[oa]|chama|nome é|nome e)\\s+([A-ZÀ-Ý][\\wÀ-ý]+(?:\\s[A-ZÀ-Ý][\\wÀ-ý]+)?)','i'));
  if(mc)return{name:mc[2].trim(),role:mc[1].toLowerCase().trim()};
  // 1b) relação seguida direto do nome (permitindo "mais velha", "mais novo" etc antes do nome)
  let m=text.match(new RegExp('\\b(?:minha |meu |a |o )?('+RELATION_TERMS+')\\s+(?:mais nov[oa] |mais velh[oa] |caçula |do meio )?(?:é\\s+(?:o |a )?)?([A-ZÀ-Ý][\\wÀ-ý]+(?:\\s[A-ZÀ-Ý][\\wÀ-ý]+)?)','i'));
  if(m)return{name:m[2].trim(),role:m[1].toLowerCase().trim()};
  // 2) após preposição/empresa + Nome Próprio
  m=text.match(/\b(?:n[ao]|d[ao]|em|para|pra|chamad[oa]|empresa|firma)\s+([A-ZÀ-Ý][\wÀ-ý]+(?:\s[A-ZÀ-Ý][\wÀ-ý]+)?)/);
  if(m)return{name:m[1].trim()};
  // 3) sigla em CAIXA ALTA
  m=text.match(/\b([A-ZÀ-Ý]{2,}[A-Za-zÀ-ý0-9]*)\b/);
  if(m&&!/^(R\$|VLVL|VLLV)$/.test(m[1]))return{name:m[1].trim()};
  if(force){m=text.match(/\b([A-ZÀ-Ý][\wÀ-ý]{2,})\b/);if(m)return{name:m[1].trim()};}
  return null;
}

// ═══════════ ROTEAMENTO: para qual persona EXISTENTE vai? ═══════════
// REGRA: só roteia entre personas que o usuário já criou. NUNCA cria persona sozinho.
// Se não casar com nenhuma existente → retorna null → cascata (pergunta ao usuário).
function routePersona(text){
  const low=text.toLowerCase();
  // 1) nome de uma persona existente aparece na frase
  for(const p of personas()){if(p.label.length>=3 && low.includes(p.label.toLowerCase()))return p;}
  // 2) palavra-chave associada a uma persona EXISTENTE
  for(const p of personas()){const rx=PERSONA_KEYWORDS[p.label];if(rx&&rx.test(text))return p;}
  // 3) nenhuma persona existente casou → NÃO inventa. Pergunta em cascata.
  return null;
}
// Mapeia um termo de relação para a persona a que ele PERTENCE por natureza.
// Isso elimina a dúvida: "filha" é sempre Família, "chefe" é sempre Trabalho.
const RELATION_TO_PERSONA={
  família:['esposa','mulher','marido','cônjuge','conjuge','companheir','namorad','noiv','filh','filho','filha','mãe','mae','pai','irmão','irmao','irmã','irma','avô','avo','avó','tio','tia','primo','prima','sogr','cunhad','parente'],
  trabalho:['chefe','gerente','sócio','socio','colega','cliente','funcionário','funcionario','diretor','equipe'],
  saúde:['médico','medico','dentista','terapeuta','psicólogo','psicologo','nutricionista'],
};
function relationPersonaLabel(role){
  if(!role)return null;
  const r=role.toLowerCase();
  for(const label in RELATION_TO_PERSONA){
    if(RELATION_TO_PERSONA[label].some(k=>r.startsWith(k)||r.includes(k)))return cap(label);
  }
  return null;
}

// ═══════════ ENVIO / INTERPRETAÇÃO ═══════════
function send(txt){
  const inp=document.getElementById('inp');const text=(txt||inp.value).trim();if(!text)return;inp.value='';
  addChat('user',text);
  // se ainda não fez onboarding e manda algo, deixa o card guiar
  const intent=parseIntent(text);
  switch(intent.type){
    case 'smalltalk': return smalltalk(text);
    case 'user_name': return setUserName(intent.newName);
    case 'rename_agent': return renameAgent(intent.newName);
    case 'create_persona': return doCreatePersona(intent.newName,intent.factText);
    case 'delete_node': return deleteByName(intent.target);
    case 'rename_node': return renameNodeByName(intent.target,intent.newName);
    case 'fact':
    default: return routeFact(text);
  }
}

// converte número por extenso ou dígito em inteiro
function parseQty(text){
  const m=text.match(/\b(\d+)\b/); if(m)return parseInt(m[1]);
  const words=[['uma?',1],['du[ao]s',2],['tr[eê]s',3],['quatro',4],['cinco',5],['seis',6],['sete',7],['oito',8]];
  for(const[w,n]of words){if(new RegExp('\\b'+w+'\\b','i').test(text))return n;}
  return null;
}
// detecta "tenho N <relação>" SEM nomes dados → entrevista guiada
function detectMultiRelation(text){
  // mapa relação-plural → singular + persona
  const rels=[
    {rx:/\bfilhas\b/i,role:'filha',persona:'Família'},
    {rx:/\bfilhos\b/i,role:'filho',persona:'Família'},
    {rx:/\birm[ãa]s\b/i,role:'irmã',persona:'Família'},
    {rx:/\birm[ãa]os\b/i,role:'irmão',persona:'Família'},
    {rx:/\bs[oó]cios\b/i,role:'sócio',persona:'Trabalho'},
  ];
  // precisa de verbo de posse e NÃO ter nome próprio (se tivesse, seria caso singular com nome)
  if(!/\b(tenho|possuo|s[aã]o|temos)\b/i.test(text))return null;
  for(const r of rels){
    if(r.rx.test(text)){
      const qty=parseQty(text)||1;
      return {qty,role:r.role,persona:r.persona,singular:r.singular};
    }
  }
  return null;
}

// roteia um fato para a persona certa
function routeFact(text){
  const sub=stripFactPrefix(text);
  const entity=detectEntity(sub);

  // (00) "tenho 2 filhas" → sabe que é Família, mas FALTAM OS NOMES → entrevista guiada
  const multi=detectMultiRelation(text);
  if(multi && !entity){ // se já veio com nome (entity), cai nos casos normais abaixo
    startRelationInterview(multi);
    return;
  }

  // (0) O fato é SOBRE uma pessoa/nó que já existe? (por NOME ou por PAPEL: "minha esposa gosta de ...")
  const subject=findSubjectNode(text);
  if(subject && subject._ambiguous){
    // vários nós com o mesmo papel (ex: 2 filhas) — pergunta de qual é
    const nomes=subject.options.map(o=>o.label).join(', ');
    const m=`Você tem mais de uma ${subject.role}: ${nomes}. De qual você fala? (diga o nome)`;
    showCaption(m);addChat('ai',m);speak(m);return;
  }
  if(subject){
    const topic=addTopic(subject, topicFromText(text, subject.label));
    if(mode==='ambient')enterMap();
    const r=`Anotei sobre <b>${subject.label}</b>: "${topic}". Já são ${subject.topics.length} tópico(s).`;
    showCaptionHTML(r);addChat('ai',`Anotei sobre ${subject.label}: ${topic}`);speak(`Anotei sobre ${subject.label}.`);
    return;
  }

  // precisa de uma persona ativa (você). Se não há, pede para criar.
  const persona=activePersona();
  if(!persona){
    const m='Primeiro preciso saber de quem é essa informação. Diga seu nome ("me chamo ...") para criar sua persona.';
    showCaption(m);addChat('ai',m);speak(m);return;
  }

  // (A) PESSOA com relação clara (filha, esposa, chefe...) → base é ÓBVIA (cria dentro da persona ativa)
  if(entity && entity.role){
    const baseLabel=relationBaseLabel(entity.role); // ex: "filha" → "Família"
    if(baseLabel){
      const {base,created}=ensureBase(baseLabel,persona.id); // cria Família dentro de Vinicius
      const node=addKnowledgeTo(base.id,sub,base.label);
      if(mode==='ambient')enterMap();
      const r=created
        ? `Criei a base <b>${base.label}</b> em ${persona.label} e adicionei <b>${node.label}</b> (${entity.role}).`
        : `Adicionei <b>${node.label}</b> (${entity.role}) na base <b>${base.label}</b> de ${persona.label}.`;
      showCaptionHTML(r);addChat('ai',r.replace(/<[^>]+>/g,''));speak(`Guardei ${node.label} em ${base.label}.`);
      return;
    }
  }

  // (B) base existente por nome/palavra-chave (dentro da persona ativa)
  const base=routeBase(text,persona.id);
  if(base){
    const node=addKnowledgeTo(base.id,sub,base.label);
    if(mode==='ambient')enterMap();
    const r=`Levei para a base <b>${base.label}</b> de ${persona.label}${node.isEntity?` (${node.label})`:''}.`;
    showCaptionHTML(r);addChat('ai',`Levei para a base ${base.label}.`);speak(`Guardei em ${base.label}.`);
    return;
  }

  // (C) dúvida real → pergunta em qual base (com nome sugerido)
  askCascade(sub,text,entity?entity.name:null);
}
// qual base EXISTENTE (dentro da persona) casa com o texto?
function routeBase(text,personaId){
  const low=text.toLowerCase();
  const bs=basesOf(personaId);
  for(const b of bs){if(b.label.length>=3&&low.includes(b.label.toLowerCase()))return b;}
  for(const b of bs){const rx=PERSONA_KEYWORDS[b.label];if(rx&&rx.test(text))return b;}
  return null;
}
// relação → nome da BASE natural (era relationPersonaLabel)
function relationBaseLabel(role){return relationPersonaLabel(role);}
function stripFactPrefix(text){
  return text.replace(/^(eu |me |tenho |sou |o |a )/i,'').trim();
}

// ═══════════ ENTREVISTA GUIADA (coletar nomes um a um) ═══════════
let interview=null; // {role, persona, qty, got:[], idx}
function startRelationInterview(multi){
  const persona=activePersona();
  if(!persona){const m='Antes, me diga seu nome ("me chamo ...") para criar sua persona.';showCaption(m);addChat('ai',m);speak(m);return;}
  // garante a BASE (ex: Família) dentro da persona ativa — parentesco é inequívoco
  const {base,created}=ensureBase(multi.persona,persona.id);
  interview={role:multi.role,baseId:base.id,qty:multi.qty,got:[],idx:1};
  if(mode==='ambient')enterMap();
  const intro=created?`Entendi — criei a base ${base.label} em ${persona.label}.`:`Entendi, vai para ${base.label}.`;
  askNextInterview(intro);
}
function ordinal(n){return ['','primeiro(a)','segundo(a)','terceiro(a)','quarto(a)','quinto(a)','sexto(a)'][n]||(n+'º');}
function askNextInterview(prefix){
  if(!interview)return;
  const b=nodeById(interview.baseId);
  const q=interview.qty;
  const which = q>1 ? `do(a) ${ordinal(interview.idx)} ${interview.role}` : `do(a) ${interview.role}`;
  showCard({
    head:`👤 ${b.label} · ${interview.idx} de ${q}`,
    text:`${prefix?prefix+'<br>':''}Qual o nome ${which}?`,
    field:{placeholder:'Nome',id:'intv-name'},
    btns:[
      {label:'Adicionar',primary:true,action:submitInterview},
      {label:'Pular',ghost:true,action:skipInterview}
    ]
  });
}
function submitInterview(){
  if(!interview)return;
  const v=document.getElementById('intv-name').value.trim();
  if(!v){skipInterview();return;}
  // cria a pessoa dentro da BASE, com o papel
  const node={id:'k'+graph.nextId++,label:cap(v),kind:'knowledge',desc:cap(interview.role),parent:interview.baseId,isEntity:true,role:interview.role,topics:[],born:performance.now()};
  graph.nodes.push(node);rebuildPositions();updateCount();
  interview.got.push(node.label);
  advanceInterview(`Adicionei <b>${node.label}</b>.`);
}
function skipInterview(){advanceInterview('');}
function advanceInterview(prefix){
  interview.idx++;
  if(interview.idx>interview.qty){
    const b=nodeById(interview.baseId);
    const names=interview.got.join(', ');
    closeCard();
    const r=interview.got.length
      ? `Pronto! Em ${b.label} agora tem: ${names}. Clique em cada um para montar o perfil dele.`
      : `Ok, deixei os nomes para depois.`;
    showCaption(r);addChat('ai',r);speak(r);interview=null;return;
  }
  askNextInterview(prefix);
}

// ═══════════ CASCATA: qual persona? → qual nó dentro dela? ═══════════
// suggestName = nome já dito (ex: Helena) para pré-preencher campos, nunca caixa vazia
function askCascade(sub,originalText,suggestName){
  pendingRoute={sub,text:originalText,stage:'persona',suggest:suggestName||pendingRoute?.suggest||null};
  const ps=personas();
  const opts = ps.map(p=>`<button class="opt" onclick="cascadePersona('${p.id}')">${p.label}</button>`).join('')
    + `<button class="opt new" onclick="cascadeNewPersona()">+ Nova persona</button>`;
  showCard({
    head:'🧭 Onde isso se encaixa?',
    text:`Não sei em qual persona guardar <b>"${sub}"</b>. A qual persona pertence?`,
    optsHtml:opts,
    btns:[{label:'Cancelar',ghost:true,action:()=>{closeCard();pendingRoute=null;}}]
  });
}
function cascadePersona(personaId){
  const p=nodeById(personaId);if(!p||!pendingRoute)return;
  pendingRoute.personaId=personaId;pendingRoute.stage='node';
  // segundo nível: direto na persona, ou dentro de um nó de conhecimento dela?
  const kids=childrenOf(personaId).filter(n=>n.kind==='knowledge');
  let opts=`<button class="opt" onclick="cascadeStore('${personaId}')">↳ Direto em ${p.label}</button>`;
  opts+=kids.map(k=>`<button class="opt" onclick="cascadeStore('${k.id}')">dentro de ${k.label}</button>`).join('');
  opts+=`<button class="opt new" onclick="cascadeNewNode()">+ Novo nó em ${p.label}</button>`;
  showCard({
    head:`🧭 Dentro de ${p.label}`,
    text:`E onde dentro de <b>${p.label}</b>? Direto na persona ou dentro de um nó?`,
    optsHtml:opts,
    btns:[{label:'Voltar',ghost:true,action:()=>askCascade(pendingRoute.sub,pendingRoute.text)}]
  });
}
function cascadeStore(parentId){
  if(!pendingRoute)return;
  addKnowledgeTo(parentId,pendingRoute.sub,'');
  const p=nodeById(parentId);
  closeCard();if(mode==='ambient')enterMap();
  const r=`Guardei "${pendingRoute.sub}" em ${p.label}.`;
  showCaption(r);addChat('ai',r);speak(r);pendingRoute=null;
}
function cascadeNewPersona(){
  if(!pendingRoute)return;
  showCard({
    head:'+ Nova persona',
    text:`Qual o nome da nova persona para guardar <b>"${pendingRoute.sub}"</b>?`,
    field:{placeholder:'ex: Projetos, Espiritual, Pets',id:'casc-p'},
    btns:[{label:'Criar e guardar',primary:true,action:()=>{
      const name=document.getElementById('casc-p').value.trim();if(!name)return;
      const {persona}=ensurePersona(name);addKnowledgeTo(persona.id,pendingRoute.sub,'');
      closeCard();enterMap();const r=`Criei a persona ${persona.label} e guardei "${pendingRoute.sub}" nela.`;showCaption(r);addChat('ai',r);speak(r);pendingRoute=null;
    }},{label:'Voltar',ghost:true,action:()=>askCascade(pendingRoute.sub,pendingRoute.text)}]
  });
}
function cascadeNewNode(){
  if(!pendingRoute||!pendingRoute.personaId)return;
  const p=nodeById(pendingRoute.personaId);
  const sug=pendingRoute.suggest||'';
  showCard({
    head:`+ Novo nó em ${p.label}`,
    text:sug?`Vou criar o nó <b>${sug}</b> em <b>${p.label}</b>. Confirme ou ajuste o nome:`:`Nome do novo nó dentro de <b>${p.label}</b>:`,
    field:{placeholder:'ex: Flexform, FIAP, Cartão',id:'casc-n',value:sug},
    btns:[{label:'Criar e guardar',primary:true,action:()=>{
      const name=document.getElementById('casc-n').value.trim();if(!name)return;
      const node={id:'k'+graph.nextId++,label:cap(name),kind:'knowledge',parent:p.id,born:performance.now()};graph.nodes.push(node);
      // se o nome do nó JÁ é a pessoa (sugerida), não duplica dentro
      if(sug&&name.toLowerCase()===sug.toLowerCase()){rebuildPositions();updateCount();}
      else addKnowledgeTo(node.id,pendingRoute.sub,'');
      closeCard();enterMap();const r=`Criei ${node.label} em ${p.label}.`;showCaption(r);addChat('ai',r);speak(r);pendingRoute=null;
    }},{label:'Voltar',ghost:true,action:()=>cascadePersona(pendingRoute.personaId)}]
  });
}

// ═══════════ INTENÇÃO (parser) ═══════════
function parseIntent(text){
  const low=text.toLowerCase().trim();
  const words=low.split(/\s+/).length;
  // nome do usuário
  const un=text.match(/\b(?:me chamo|meu nome (?:é|e|:)|eu sou(?: o| a)?|sou(?: o| a))\s+([A-Za-zÀ-ú]{2,20})\b/i);
  if(un && !/seu nome|te cham|voc[eê]/i.test(low))return{type:'user_name',newName:un[1]};
  // saudação / pergunta
  const isGreeting=/^(oi+|ol[aá]|e a[ií]|opa|bom dia|boa tarde|boa noite|hey|hi|hello|tudo bem|blz|beleza|valeu|obrigad|brigad|tchau|falou|ok|okay|entendi|certo|legal|show|massa|haha|kk+)\b/i.test(low);
  const isQuestion=/\?\s*$/.test(text)||/^(qual|quais|quando|onde|como|quem|por ?que|quanto|o que|cad[eê]|vc |voc[eê] |me (?:diz|fala|conta|explica|ajuda|mostra)|pode |consegue |sabe )/i.test(low);
  const delVerbs=/\b(apag\w*|delet\w*|remov\w*|exclu\w*|tir[ae]\w*|elimin\w*|esque(?:ce|ça|cer)\w*)\b/i;
  const hasCommand=delVerbs.test(low)||/\b(renomei|mud|troqu|altera|cham|cri[ae]|adicion|persona)/i.test(low);
  if((isGreeting||isQuestion||(words<=2&&!/\d/.test(low)))&&!hasCommand)return{type:'smalltalk'};
  // criar persona explícita: "cria a persona Projetos", "nova persona Saúde"
  let mp=text.match(/\b(?:cri[ae]r?|nov[ao]|adicion\w*)\s+(?:a |uma |o )?persona\s+([A-Za-zÀ-ú0-9 ]{2,24})/i);
  if(mp){return{type:'create_persona',newName:mp[1].trim().replace(/\s+(e|que).*/i,'')};}
  // apagar
  if(delVerbs.test(low)){const n=findNodeInText(text);if(n)return{type:'delete_node',target:n};
    const m=text.match(/\b(?:apag\w*|delet\w*|remov\w*|exclu\w*|esque\w*)\s+(?:a |o |persona |n[oó] )?([A-Za-zÀ-ú0-9 ]{2,30})/i);
    if(m)return{type:'delete_node',target:{_rawName:m[1].trim()}};}
  // renomear agente
  const agentCue=/(seu nome|te cham|me cham|voc[eê] (?:se chama|vai se chamar))/i.test(low)||low.includes(agentName.toLowerCase());
  const citedNode=findNodeInText(text);
  const dest=text.match(/\b(?:para|pra|por|:)\s+([A-Za-zÀ-ú0-9 ]{2,30})\s*$/i);
  if(/\b(renomei|mud|troqu|altera)/i.test(low)&&citedNode&&dest&&!agentCue)return{type:'rename_node',target:citedNode,newName:dest[1].trim()};
  if(agentCue){const c=text.match(/n[aã]o é\s+\S+[, ]+(?:e sim|mas sim|e)\s+([A-Za-zÀ-ú0-9]{2,16})/i);if(c)return{type:'rename_agent',newName:c[1]};
    const m=text.match(/\b(?:ser[aá]|será|é|de|por|para|pra|:)\s+([A-Za-zÀ-ú0-9]{2,16})\s*$/i);if(m)return{type:'rename_agent',newName:m[1]};
    const m2=text.match(/\b(?:ser[aá]|será|é|de|por|para|pra|:)\s+([A-Za-zÀ-ú0-9]{2,16})/i);if(m2)return{type:'rename_agent',newName:m2[1]};}
  return{type:'fact'};
}
function editableNodes(){return graph.nodes.filter(n=>n.kind!=='orchestrator');}
function findNodeInText(text){const low=text.toLowerCase();
  const c=editableNodes().slice().sort((a,b)=>{const ap=a.kind==='persona'?1:0,bp=b.kind==='persona'?1:0;if(ap!==bp)return ap-bp;return b.label.length-a.label.length;});
  for(const n of c){if(n.label.length>=3&&low.includes(n.label.toLowerCase()))return n;}return null;}

// ═══════════ AÇÕES ═══════════
function smalltalk(text){
  const low=text.toLowerCase();
  const isQuestion=/\?\s*$/.test(text)||/^(qual|quais|quando|onde|como|quem|quanto|o que|me fala|me conta|fala sobre|o que sei|o que você sabe|o que voce sabe)/i.test(low);
  if(isQuestion){ return answerQuery(text); }
  const r=userName?`Oi, ${userName}! Pode mandar — eu organizo nas personas certas.`:'Oi! Pode falar comigo.';
  showCaption(r);addChat('ai',r);speak(r);
}

// ═══════════ RECUPERAÇÃO / CONSULTA (memória semântica local) ═══════════
// expande a pergunta com sinônimos p/ busca por significado (sem embeddings)
const SYN={
  gosta:['gosta','gosto','prefere','curte','ama','adora','fã','preferência','preferencia'],
  trabalho:['trabalho','trabalha','emprego','empresa','profissão','profissao','carreira'],
  viagem:['viagem','viajar','viaja','passeio','férias','ferias','conhecer','visitar','gramado','praia'],
  aniversário:['aniversário','aniversario','nasceu','nascimento','idade','anos'],
  compromisso:['compromisso','consulta','médico','medico','reunião','reuniao','agenda','encontro'],
  objetivo:['objetivo','meta','sonho','quer','deseja','pretende','planeja'],
};
function expandQuery(q){
  const low=q.toLowerCase();const terms=new Set(low.split(/\W+/).filter(w=>w.length>2));
  for(const k in SYN){if(SYN[k].some(s=>low.includes(s)))SYN[k].forEach(s=>terms.add(s));}
  return [...terms];
}
function answerQuery(question){
  const low=question.toLowerCase();
  // 1) a pergunta cita uma pessoa/entidade específica? (por nome ou papel)
  let subject=findSubjectNode(question);
  if(subject && subject._ambiguous){
    const nomes=subject.options.map(o=>o.label).join(', ');
    const m=`Você tem mais de uma ${subject.role}: ${nomes}. De qual você quer saber?`;
    showCaption(m);addChat('ai',m);speak(m);return;
  }
  if(!subject)subject=personas().find(p=>low.includes(p.label.toLowerCase()));
  if(subject){
    return answerAboutSubject(subject,question);
  }
  // 2) pergunta por tema geral (ex: "compromissos da família", "planos de viagem")
  const terms=expandQuery(question);
  const hits=searchAll(terms);
  if(hits.length){
    const lines=hits.slice(0,8).map(h=>`• ${h.where}: ${h.text}`);
    const r=`Encontrei isto:\n${lines.join('\n')}`;
    showCaptionHTML(r.replace(/\n/g,'<br>'));addChat('ai',r);speak(`Encontrei ${hits.length} coisas relacionadas.`);
    return;
  }

function answerAboutSubject(node,question){

function searchAll(terms){
  const hits=[];
  graph.nodes.forEach(n=>{
    if(n.kind==='orchestrator')return;
    const parent=nodeById(n.parent);
    const where=n.kind==='persona'?n.label:(parent?parent.label+' › '+n.label:n.label);
    // o próprio nome do nó
    if(terms.some(t=>n.label.toLowerCase().includes(t)))hits.push({where:parent?parent.label:'rede',text:n.label});

function playBrainVideo(){const v=document.getElementById('brain-video');if(!v)return;
  const wr=document.getElementById('brain-video-wrap');if(wr)wr.style.visibility='hidden'; // começa escondido até confirmar que toca

  v.onended=()=>{ if(mode!=='brain')return; const elapsed=performance.now()-_brainCycleStart; const wait=Math.max(0,BRAIN_CYCLE_MS-elapsed); clearTimeout(_brainCycleT); _brainCycleT=setTimeout(()=>{ if(mode==='brain')startBrainCycle(); },wait); };

  drag={node:n,moved:false,startX:x,startY:y, detailChild: mode==='detail'&&n.id!==detailId, menuOpened:false};
  canvas.style.cursor='grabbing';
  // CLIQUE LONGO (segurar ~0,45s parado) → abre o menu (Cor, Renomear, Apagar)
  drag.lpTimer=setTimeout(()=>{
    if(drag&&!drag.moved){ drag.menuOpened=true; openNodeMenu(n,x,y); if(navigator.vibrate)navigator.vibrate(15); }
  },450);
  if(e.cancelable)e.preventDefault();
}
function clearLP(){ if(drag&&drag.lpTimer){clearTimeout(drag.lpTimer);drag.lpTimer=null;} }
function onDragMove(e){
  if(!drag){ // hover normal (cursor + tooltip)
    if(mode==='ambient'){canvas.style.cursor='pointer';return;}
    const {x,y}=evtXY(e);
    const n=mode==='detail'?pickDetail(x,y):pickGraph(x,y);hoverNode=n;const info=document.getElementById('node-info');
    if(n&&n.kind!=='orchestrator'){const cat=n.kind==='persona'?'PERSONA':n.kind==='base'?'BASE':(n.srcKey?'FONTE':'pessoa');document.getElementById('ni-cat').textContent=cat;document.getElementById('ni-cat').style.color=n.kind==='persona'?PERSONA_COLOR:n.kind==='base'?'#c4b5fd':'#4de8ff';document.getElementById('ni-title').textContent=n.label;document.getElementById('ni-desc').textContent=n.desc||((n.kind==='persona'||n.kind==='base')?childrenOf(n.id).length+' itens':'');
      const c=mode==='detail'?{x:n._dx,y:n._dy}:laidOut[n.id]||{x:n.x,y:n.y};info.style.left=c.x+'px';info.style.top=c.y+'px';info.classList.add('show');canvas.style.cursor='grab';}
    else{info.classList.remove('show');canvas.style.cursor=n?'grab':'default';}
    return;
  }
  // arrastando
  const {x,y}=evtXY(e);
  if(Math.hypot(x-drag.startX,y-drag.startY)>4){drag.moved=true;clearLP();} // moveu → cancela o clique longo
  if(drag.menuOpened)return; // se o menu já abriu, não arrasta
  document.getElementById('node-info').classList.remove('show');
  if(drag.detailChild){ drag.node._px=x; drag.node._py=y; drag.node._dx=x; drag.node._dy=y; }
  else if(drag.node.kind==='orchestrator'){ // arrastar o VLLV → a árvore inteira acompanha
    drag.node.pinned=true; drag.node.px=x; drag.node.py=y; rebuildPositions();
  }
  else{ const s=laidOut[drag.node.id]; if(s){ s.pinned=true; s.px=x; s.py=y; s.x=x; s.y=y; } }
  // detecta ALVO de soltar (outro nó sob o cursor) para re-vincular
  const prev=dropTarget;
  dropTarget = drag.moved ? findDropTarget(x,y,drag.node) : null;
  // SEGURAR PARADO sobre um alvo (~0,6s) → entra no modo LIGAR (adiciona vínculo, sem tirar do atual)
  if(dropTarget){
    if(!prev||prev.id!==dropTarget.id){ drag.overSince=performance.now(); drag.linkMode=false; }
    else if(!drag.linkMode && performance.now()-(drag.overSince||0)>600){ drag.linkMode=true; if(navigator.vibrate)navigator.vibrate([10,30,10]); showCaption(`Solte para LIGAR "${drag.node.label}" também a "${dropTarget.label}" (vínculo extra).`); }
  } else { drag.overSince=0; drag.linkMode=false; }

let dropTarget=null;
// acha um nó válido para receber o arrastado (não ele mesmo nem seus descendentes)
function findDropTarget(x,y,dragged){
  if(mode==='detail')return null; // reparent só no mapa geral por enquanto
  const banned=new Set([dragged.id]);
  (function collect(id){childrenOf(id).forEach(c=>{banned.add(c.id);collect(c.id);});})(dragged.id);
  let best=null,bestD=1e9;
  for(const n of graph.nodes){
    if(banned.has(n.id))continue;
    if(n.kind==='leaf')continue; // folhas não recebem filhos
    const c=laidOut[n.id];if(!c||!isFinite(c.x))continue;
    const d=Math.hypot(x-c.x,y-c.y);
    if(d<c.r+22&&d<bestD){best=n;bestD=d;}
  }
  return best;
}
function onDragEnd(e){
  if(!drag)return;
  clearLP();
  const wasMove=drag.moved, node=drag.node, menuOpened=drag.menuOpened;
  canvas.style.cursor='grab';
  if(menuOpened){ drag=null;dropTarget=null; return; } // menu já aberto pelo clique longo
  if(!wasMove){ // clique curto → comportamento normal (abrir)
    handleNodeClick(node,e);
  } else if(node.kind==='orchestrator'){ // VLLV foi movido → fixa e a árvore acompanha
    node.pinned=true;rebuildPositions();saveState();
  } else if(dropTarget){
    if(drag.linkMode){ addLink(node,dropTarget.id); }      // segurou sobre o alvo → LIGA (vínculo extra)
    else { reparentNode(node,dropTarget.id); }              // soltou rápido → MOVE (troca o pai principal)
  } else {
    // soltou no vazio → fixa a posição
    if(!drag.detailChild){const s=laidOut[node.id];if(s){node.px=s.px;node.py=s.py;node.pinned=true;}}
    saveState();
  }
  drag=null;dropTarget=null;
}
// move um nó para dentro de outro (muda o parent)
function reparentNode(node,newParentId){
  if(!node||node.id===newParentId)return;
  if(node.kind==='orchestrator'){showCaption('O orquestrador não entra em outros nós.');return;}
  // persona LIGADA (não-solta) não vira filha por arraste acidental; mas uma persona SOLTA pode.
  if(node.kind==='persona'&&!node.floating){showCaption('Para mover uma persona, solte-a primeiro (✂️) e depois arraste.');return;}
  // ciclo? não deixa cair num descendente
  let p=nodeById(newParentId);while(p){if(p.id===node.id){showCaption('Não dá para colocar dentro de um descendente.');return;}p=nodeById(p.parent);}
  const target=nodeById(newParentId);if(!target)return;
  node.parent=newParentId;
  // reclassifica o kind conforme o novo pai (qualquer nó solto vira dependente do destino)
  if(target.kind==='orchestrator')node.kind='persona';
  else if(target.kind==='persona')node.kind='base';
  else node.kind='knowledge';
  node.floating=false; // deixou de ser solto
  node.pinned=false;delete node.px;delete node.py; // volta a posicionar automático
  rebuildPositions();updateCount();saveState();
  showCaption(`"${node.label}" agora é dependente de "${target.label}".`);addChat('ai',`Vinculei ${node.label} dentro de ${target.label}.`);
}
// corta o vínculo: o nó fica TOTALMENTE solto (sem pai, sem linha), flutuando onde está
function detachNode(node){
  if(!node||node.kind==='orchestrator')return;
  const fromDetail=(mode==='detail');
  node.parent=null;            // sem pai — nem o orquestrador
  node.links=[];               // também remove os vínculos extras
  node.floating=true;          // marca como nó solto
  if(!node.color&&node.kind==='persona')node.color=personaColors[node.id]; // preserva a cor que tinha
  // se foi solto de DENTRO de um nó (modo detalhe), volta ao mapa para o usuário ver o nó livre
  if(fromDetail){ backToMap(); }
  // posiciona numa "zona livre" na base da tela, bem visível e sem sobrepor outros soltos
  const {px,py}=freeSpot(node);
  node.pinned=true;node.px=px;node.py=py;
  rebuildPositions();updateCount();saveState();
  showCaption(`"${node.label}" está solto (sem vínculo). Arraste-o para dentro de outro nó, ou apague.`);addChat('ai',`Soltei ${node.label} — livre, sem vínculo. Arraste-o sobre outro nó para re-vincular.`);
}
// acha um ponto livre na faixa de baixo da tela para pousar um nó solto
function freeSpot(self){
  const laneY=H*0.80;                       // faixa dos nós livres
  const taken=floatingNodes().filter(n=>n!==self&&isFinite(n.px)).map(n=>n.px);
  const slotW=Math.max(90,W/8);
  for(let i=0;i<9;i++){
    const x=W*0.14 + i*slotW;
    if(x>W*0.9)break;
    if(!taken.some(tx=>Math.abs(tx-x)<slotW*0.7)) return {px:x,py:laneY};
  }
  return {px:W*0.2+Math.random()*W*0.6, py:laneY};
}
let lastTap={id:null,t:0};
// expande/colapsa um nó (mostra ou esconde os filhos diretos)
function toggleExpand(n){ n.expanded=!n.expanded; rebuildPositions(); saveState(); }
function handleNodeClick(n,e){
  closeNodeMenu();restoreMenu();
  if(n.srcKey){showCaption(n.label+': '+n.desc);return;}
  const now=performance.now();
  // VLLV: clique simples expande/colapsa as personas; DOIS toques volta para a tela inicial
  if(n.kind==='orchestrator'){
    if(lastTap.id==='vllv' && (now-lastTap.t)<420){ lastTap={id:null,t:0}; enterBrain(); return; }
    lastTap={id:'vllv',t:now}; toggleExpand(n); return;
  }
  // DOIS TOQUES rápidos (não-persona) → solta o vínculo
  if(n.kind!=='persona' && lastTap.id===n.id && (now-lastTap.t)<420){ lastTap={id:null,t:0}; detachNode(n); return; }
  lastTap={id:n.id,t:now};
  const isKnowledge = (n.kind==='knowledge'||n.kind==='leaf'); // pessoas/entidades TÊM ficha
  // pessoa/entidade: abre a FICHA sempre; se também tiver filhos, EXPANDE junto.
  // Clicar de novo (ficha já aberta nesse nó) COLAPSA os filhos.
  if(isKnowledge){
    if(hasKids(n.id)){
      if(openKbId===n.id && n.expanded){ n.expanded=false; rebuildPositions(); saveState(); } // 2º clique fecha os filhos
      else if(!n.expanded){ n.expanded=true; rebuildPositions(); saveState(); }
    }
    openKb(n);
    return;
  }
  // persona/base (contêiner, sem ficha) → clique simples só abre/fecha os filhos
  if(hasKids(n.id)){ toggleExpand(n); return; }
  const xy=evtXY(e);openNodeMenu(n,xy.x,xy.y);
}

canvas.addEventListener('dblclick',(e)=>{

function pickGraph(cx,cy){for(let i=graph.nodes.length-1;i>=0;i--){const n=graph.nodes[i],c=laidOut[n.id];if(!c)continue;const hit=n.kind==='orchestrator'?c.r*2.6:(n.shape==='geo'?c.r*3+6:c.r+8);if(Math.hypot(cx-c.x,cy-c.y)<hit)return n;}for(const k in laidOut){if(k.startsWith('src_')){const c=laidOut[k];if(Math.hypot(cx-c.x,cy-c.y)<c.r+8)return{label:c.src.name,desc:c.src.state==='on'?'Fonte ativa':'Aguardando',srcKey:k};}}return null;}
function pickDetail(cx,cy){const node=nodeById(detailId);if(!node)return null;const hit=Math.max(18,22*UI);for(const k of childrenOf(node.id)){if(k._dx&&Math.hypot(cx-k._dx,cy-k._dy)<hit)return k;}return null;}
