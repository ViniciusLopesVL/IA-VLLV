let legendRAF=null, legendSparks=[];
function startLegendFX(){
  const img=document.getElementById('legend-img'), cv=document.getElementById('legend-fx');
  if(!img||!cv)return;const c2=cv.getContext('2d');
  const setup=()=>{
    const w=img.clientWidth,h=img.clientHeight;if(!w||!h){requestAnimationFrame(setup);return;}
    const dpr=devicePixelRatio||1;cv.width=w*dpr;cv.height=h*dpr;cv.style.width=w+'px';cv.style.height=h+'px';c2.setTransform(dpr,0,0,dpr,0,0);
    // região aproximada do cérebro na imagem (proporções)
    legendSparks=[];const bx0=0.30,bx1=0.72,by0=0.26,by1=0.72;
    for(let i=0;i<90;i++){legendSparks.push({x:(bx0+Math.random()*(bx1-bx0))*w,y:(by0+Math.random()*(by1-by0))*h,r:Math.random()*1.8+0.6,ph:Math.random()*6.28,sp:0.6+Math.random()*1.8,hue:Math.random()<0.78?'#8ff0ff':(Math.random()<0.5?'#fff0a0':'#ffb0e0')});}
    // pulsos viajando por "trilhas"
    legendSparks.pulses=[];for(let i=0;i<8;i++){const ax=(0.30+Math.random()*0.42)*w,ay=(0.28+Math.random()*0.42)*h;legendSparks.pulses.push({x:ax,y:ay,tx:(0.30+Math.random()*0.42)*w,ty:(0.28+Math.random()*0.42)*h,t:Math.random()});}
    const loop=()=>{
      const w=img.clientWidth,h=img.clientHeight;c2.clearRect(0,0,w,h);const now=performance.now()/1000;
      c2.globalCompositeOperation='lighter';
      legendSparks.forEach(s=>{const a=0.25+0.55*(0.5+0.5*Math.sin(now*s.sp+s.ph));const rr=s.r*(0.8+0.5*Math.sin(now*s.sp+s.ph));
        const g=c2.createRadialGradient(s.x,s.y,0,s.x,s.y,rr*3);g.addColorStop(0,hexA(s.hue,a));g.addColorStop(1,hexA(s.hue,0));c2.fillStyle=g;c2.beginPath();c2.arc(s.x,s.y,rr*3,0,6.28);c2.fill();
        c2.fillStyle=hexA('#ffffff',a*0.8);c2.beginPath();c2.arc(s.x,s.y,rr*0.7,0,6.28);c2.fill();});
      (legendSparks.pulses||[]).forEach(p=>{p.t+=0.006;if(p.t>1){p.t=0;p.x=p.tx;p.y=p.ty;p.tx=(0.30+Math.random()*0.42)*w;p.ty=(0.28+Math.random()*0.42)*h;}
        const px=p.x+(p.tx-p.x)*p.t,py=p.y+(p.ty-p.y)*p.t;const g=c2.createRadialGradient(px,py,0,px,py,7);g.addColorStop(0,hexA('#aef6ff',.9));g.addColorStop(1,hexA('#aef6ff',0));c2.fillStyle=g;c2.beginPath();c2.arc(px,py,7,0,6.28);c2.fill();});
      c2.globalCompositeOperation='source-over';
      if(document.getElementById('legend').classList.contains('open'))legendRAF=requestAnimationFrame(loop);
    };
    cancelAnimationFrame(legendRAF);loop();
  };
  if(img.complete)setup();else img.onload=setup;
}
function closeLegend(){document.getElementById('legend').classList.remove('open');cancelAnimationFrame(legendRAF);}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeLegend();});
document.getElementById('legend').addEventListener('click',e=>{if(e.target.id==='legend')closeLegend();});

// ═══════════ VOZ ═══════════
function loadVoices(){const raw=speechSynthesis.getVoices();if(!raw.length)return;const pri=['pt-BR','pt-PT','en-US','en-GB'];voices=raw.filter(v=>pri.some(p=>v.lang.startsWith(p.split('-')[0]))).sort((a,b)=>{const ai=pri.indexOf(a.lang),bi=pri.indexOf(b.lang);return(ai===-1?99:ai)-(bi===-1?99:bi);});if(!voices.length)voices=raw;selectedVoice=voices.find(v=>v.lang.startsWith('pt'))||voices[0];voiceIdx=voices.indexOf(selectedVoice);updateChip();}
function classify(v){const n=(v?.name||'').toLowerCase();if(/child|kid|criança|junior/.test(n))return'child';if(/female|woman|maria|lucia|luciana|francisca|helena|ana|zira|hazel|fernanda/.test(n))return'female';return'male';}
function updateChip(){if(!selectedVoice){document.getElementById('vc-name').textContent='sem voz';return;}const ty=classify(selectedVoice);document.getElementById('vc-icon').textContent=ty==='female'?'👩':ty==='child'?'🧒':'👨';let nm=selectedVoice.name.replace(/microsoft|google/gi,'').replace(/\(.*?\)/g,'').replace(/-.*/,'').trim();document.getElementById('vc-name').textContent=(nm||selectedVoice.name)+' · '+selectedVoice.lang;}
function cycleVoice(){if(!voices.length)return;voiceIdx=(voiceIdx+1)%voices.length;selectedVoice=voices[voiceIdx];updateChip();speak('Olá! Esta é minha nova voz.');}
speechSynthesis.onvoiceschanged=loadVoices;loadVoices();setTimeout(loadVoices,500);
function toggleTTS(){ttsOn=!ttsOn;const b=document.getElementById('tts-btn');b.textContent=ttsOn?'🔊':'🔇';b.classList.toggle('on',ttsOn);if(!ttsOn)speechSynthesis.cancel();}
function speak(x){if(!ttsOn||!speechSynthesis)return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(x);if(selectedVoice){u.voice=selectedVoice;u.lang=selectedVoice.lang;}u.rate=1.0;u.pitch=classify(selectedVoice)==='child'?1.4:1.0;u.onstart=()=>setState('speaking');u.onend=u.onerror=()=>setState('idle');speechSynthesis.speak(u);}

// ═══════════ MIC (falar com o VLLV) ═══════════
function toggleMic(){isListening?stopMic():startMic();}
async function startMic(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  // 1) navegador sem suporte (Firefox, alguns in-app browsers, iOS antigo)
  if(!SR){ showCaption('Seu navegador não reconhece voz. Use o Chrome (Android/PC) ou o Safari no iPhone — e digite por enquanto.'); return; }
  // 2) precisa de HTTPS (ou localhost). Arquivo aberto direto (file://) bloqueia o microfone.
  const okOrigin = location.protocol==='https:' || location.hostname==='localhost' || location.hostname==='127.0.0.1';
  if(!okOrigin){ showCaption('O microfone só funciona num site https (ex.: GitHub Pages). Abrindo o arquivo direto, ele fica bloqueado — digite sua mensagem.'); return; }
  // 3) pede permissão do microfone de forma explícita, com mensagem clara se negar
  try{ if(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia){ const st=await navigator.mediaDevices.getUserMedia({audio:true}); st.getTracks().forEach(t=>t.stop()); } }
  catch(err){ showCaption('Preciso da permissão do microfone. Toque no cadeado 🔒 da barra de endereço → Microfone → Permitir, e tente de novo.'); return; }
  // 4) inicia o reconhecimento
  try{
    recognition=new SR();
    recognition.lang=(selectedVoice&&selectedVoice.lang)||'pt-BR';
    recognition.continuous=false;recognition.interimResults=true;
    recognition.onstart=()=>{isListening=true;const b=document.getElementById('mic-btn');b.classList.add('mic-on');b.textContent='⏹';setState('listening');showCaption('Ouvindo… pode falar.');};
    recognition.onresult=(e)=>{const tx=Array.from(e.results).map(r=>r[0].transcript).join('');document.getElementById('inp').value=tx;if(e.results[e.results.length-1].isFinal){stopMic();setTimeout(()=>send(tx),200);}};
    recognition.onerror=(e)=>{ const m={'not-allowed':'Permissão do microfone negada. Libere no cadeado 🔒 da barra de endereço.','service-not-allowed':'Permissão do microfone negada pelo navegador.','no-speech':'Não ouvi nada. Toque no microfone e fale mais perto.','audio-capture':'Nenhum microfone encontrado no aparelho.','network':'Sem internet: o reconhecimento de voz precisa de conexão.','aborted':''}[e.error]; if(m)showCaption(m); stopMic(); };
    recognition.onend=stopMic;
    recognition.start();
  }catch(err){ showCaption('Não consegui iniciar o microfone: '+(err.message||err)); stopMic(); }
}
function stopMic(){isListening=false;try{recognition&&recognition.stop();}catch(e){}const b=document.getElementById('mic-btn');if(b){b.classList.remove('mic-on');b.textContent='🎙️';}setState('idle');}

let openKbId=null;
function openKb(node){
  openKbId=node.id;
  document.getElementById('kb-title').textContent=node.label;
  document.getElementById('kb-sub').textContent=node.role?cap(node.role):(nodeById(node.parent)?.label||'');
  document.getElementById('kb-input').placeholder=`Adicionar sobre ${node.label}...`;
  renderKbPanel(node);
  document.getElementById('kb-panel').classList.add('open');
}
function closeKb(){openKbId=null;document.getElementById('kb-panel').classList.remove('open');}
function renderKbPanel(node){
  const box=document.getElementById('kb-topics');
  const tops=node.topics||[];
  if(!tops.length){box.innerHTML=`<div class="kb-empty">Ainda não sei nada específico sobre ${node.label}.<br>Escreva abaixo ou me conte na conversa (ex: "${node.label} faz aniversário em maio").</div>`;return;}
  box.innerHTML=tops.map((t,i)=>`<div class="kb-topic"><span class="kb-bullet">▸</span><span>${t.replace(/</g,'&lt;')}</span><button class="kb-rm" onclick="kbRemove(${i})">✕</button></div>`).join('');
}
function kbAdd(){
  const node=nodeById(openKbId);if(!node)return;
  const inp=document.getElementById('kb-input');const v=inp.value.trim();if(!v)return;
  addTopic(node,v);inp.value='';renderKbPanel(node);
}
function kbRemove(i){
  const node=nodeById(openKbId);if(!node||!node.topics)return;
  node.topics.splice(i,1);saveState();renderKbPanel(node);
}
// ações diretas no painel da pessoa/nó
function kbDetach(){
  const node=nodeById(openKbId);if(!node)return;
  closeKb();
  detachNode(node); // fica totalmente solto (sem pai) e visível no mapa
}
function kbDeleteFromPanel(){
  const node=nodeById(openKbId);if(!node)return;
  closeKb();
  deleteNode(node);
}
function kbColorFromPanel(){
  const node=nodeById(openKbId);if(!node)return;
  const box=document.getElementById('kb-topics');
  const cur=node.color||colorOf(node);
  const swatches=SWATCHES.map(c=>`<button class="sw${(node.color||'').toLowerCase()===c.toLowerCase()?' sel':''}" style="background:${c}" onclick="kbSetColor('${c}')" title="${c}"></button>`).join('');
  box.innerHTML=`<div class="nm-title" style="margin-bottom:8px">Cor de ${node.label}</div><div class="sw-grid">${swatches}</div>`
    +`<label class="sw-custom" style="margin-top:10px">🎨 Cor personalizada<input type="color" id="kb-pick" value="${/^#([0-9a-f]{6})$/i.test(cur)?cur:'#a78bfa'}" oninput="kbSetColor(this.value,true)"></label>`
    +`<button class="kb-act" style="margin-top:10px;width:100%" onclick="kbSetColor(null)">↺ Cor padrão</button>`
    +`<button class="kb-act" style="margin-top:6px;width:100%" onclick="renderKbPanel(nodeById(openKbId))">← Voltar</button>`;
}
function kbSetColor(c,keep){
  const node=nodeById(openKbId);if(!node)return;
  if(c){ node.color=c; if(node.kind==='persona')personaColors[node.id]=c; }
  else { delete node.color; if(node.kind==='persona')personaColors[node.id]=customColor(node.label); }
  saveState();
  if(keep){ document.querySelectorAll('#kb-topics .sw').forEach(el=>el.classList.toggle('sel',(el.title||'').toLowerCase()===c.toLowerCase())); return; }
  renderKbPanel(node);
}

function openPanel(){renderPanel();document.getElementById('panel').classList.add('open');}
function closePanel(){document.getElementById('panel').classList.remove('open');}
function renderPanel(){const g={};sources.forEach(s=>{(g[s.group]=g[s.group]||[]).push(s);});let h='<p style="font-size:12px;color:var(--dim);line-height:1.6;margin-bottom:8px">Fontes alimentam suas personas automaticamente ou sob permissão.</p>';for(const gr in g){h+='<div class="src-group-title">'+gr+'</div>';g[gr].forEach(s=>{const c=s.state==='on'?'st-on':'st-off',tt=s.state==='on'?'● Conectada':'○ Desligada';h+='<div class="src-item"><div class="src-icon">'+s.icon+'</div><div class="src-info"><div class="src-name">'+s.name+(s.auto?'<span class="src-auto">auto</span>':'')+'</div><div class="src-state '+c+'">'+tt+'</div></div>'+(s.fixed?'':'<button class="src-toggle'+(s.state==='on'?' on':'')+'" onclick="toggleSource(\''+s.id+'\')"></button>')+'</div>';});}document.getElementById('panel-body').innerHTML=h;}
function toggleSource(id){const s=sources.find(x=>x.id===id);s.state=s.state==='on'?'off':'on';rebuildPositions();renderPanel();saveState();if(s.state==='on'){const m=s.auto?`${s.name} conectada. Vou alimentar as personas automaticamente.`:`${s.name} conectada. Busco quando você permitir.`;showCaption(m);speak(m);}}

// saudação conforme a hora do dia
function greeting(){
  const h=new Date().getHours();
  const parte = h<12 ? 'Bom dia' : (h<18 ? 'Boa tarde' : 'Boa noite');
  const nome = userName ? `, ${userName}` : '';
  return `${parte}${nome}! Como vai? Precisa de algo?`;
}
